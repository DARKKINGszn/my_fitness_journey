<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient with subtle lemon glow in the center -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2e05" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    
    <!-- Lemon Gradient for Dumbbell -->
    <linearGradient id="lemon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0ff33" />
      <stop offset="100%" stop-color="#a3d900" />
    </linearGradient>

    <!-- Liquid Glass Overlay Gradient -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Subtle Glass Backdrop Card (Enhances the liquid glass look) -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="352" height="352" rx="88" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
    <path d="M80 168 A88 88 0 0 1 168 80 L344 80 A88 88 0 0 1 432 168 L432 200 A280 280 0 0 0 80 280 Z" fill="#ffffff" fill-opacity="0.05" />
  </g>

  <!-- Dynamic Angled Dumbbell -->
  <g transform="rotate(-45 256 256)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="220" y="240" width="72" height="32" rx="8" fill="url(#lemon-grad)" />
    
    <!-- Left Inner Weight -->
    <rect x="180" y="192" width="32" height="128" rx="12" fill="url(#lemon-grad)" />
    <!-- Left Outer Weight -->
    <rect x="116" y="160" width="56" height="192" rx="16" fill="url(#lemon-grad)" />
    
    <!-- Right Inner Weight -->
    <rect x="300" y="192" width="32" height="128" rx="12" fill="url(#lemon-grad)" />
    <!-- Right Outer Weight -->
    <rect x="340" y="160" width="56" height="192" rx="16" fill="url(#lemon-grad)" />

    <!-- ====== LIQUID GLASS HIGHLIGHTS ====== -->
    <!-- Handle Gloss -->
    <rect x="220" y="242" width="72" height="10" rx="4" fill="#ffffff" fill-opacity="0.5" />
    
    <!-- Left Inner Gloss -->
    <path d="M 180 204 A 12 12 0 0 1 192 192 L 200 192 A 12 12 0 0 1 212 204 L 212 300 L 180 300 Z" fill="url(#glass-shine)" />
    <rect x="182" y="194" width="8" height="124" rx="4" fill="#ffffff" fill-opacity="0.6" />
    
    <!-- Left Outer Gloss -->
    <path d="M 116 176 A 16 16 0 0 1 132 160 L 156 160 A 16 16 0 0 1 172 176 L 172 320 L 116 320 Z" fill="url(#glass-shine)" />
    <rect x="118" y="162" width="12" height="188" rx="6" fill="#ffffff" fill-opacity="0.6" />
    
    <!-- Right Inner Gloss -->
    <path d="M 300 204 A 12 12 0 0 1 312 192 L 320 192 A 12 12 0 0 1 332 204 L 332 300 L 300 300 Z" fill="url(#glass-shine)" />
    <rect x="302" y="194" width="8" height="124" rx="4" fill="#ffffff" fill-opacity="0.6" />

    <!-- Right Outer Gloss -->
    <path d="M 340 176 A 16 16 0 0 1 356 160 L 376 160 A 16 16 0 0 1 392 176 L 392 320 L 340 320 Z" fill="url(#glass-shine)" />
    <rect x="342" y="162" width="12" height="188" rx="6" fill="#ffffff" fill-opacity="0.6" />
  </g>
</svg>
