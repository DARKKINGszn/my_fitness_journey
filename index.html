<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <!-- Set native iOS status bar background color to our dark theme -->
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fits">
    <title>Fits</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon.png?v=3">
    <link rel="apple-touch-icon" href="icon.png?v=3">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            main: 'var(--brand-main)',
                            bg: 'var(--brand-bg)',
                            contrast: 'var(--brand-contrast)',
                            muted: 'var(--brand-muted)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* THEME VARIABLES */
        :root, .theme-lemon {
            --brand-main: #e0ff33; /* Neon Lemon */
            --brand-bg: #222a00;
            --brand-contrast: #000000;
            --brand-muted: #5e7300;
        }
        .theme-purple {
            --brand-main: #a78bfa;
            --brand-bg: #2e1a47;
            --brand-contrast: #000000;
            --brand-muted: #6d28d9;
        }
        .theme-cyan {
            --brand-main: #22d3ee;
            --brand-bg: #083344;
            --brand-contrast: #000000;
            --brand-muted: #0e7490;
        }
        .theme-rose {
            --brand-main: #fb7185;
            --brand-bg: #4c0519;
            --brand-contrast: #000000;
            --brand-muted: #be123c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #f4f4f5; /* zinc-100 */
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up-modal { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Custom Checkbox - Fully Rounded Now */
        .custom-checkbox input:checked + div {
            background-color: var(--brand-main);
            border-color: var(--brand-main);
        }
        .custom-checkbox input:checked + div svg { 
            display: block; 
            color: var(--brand-contrast);
        }
        
        /* Activity Heatmap Graph */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            border-radius: 9999px; /* Pill shaped cells */
        }

        /* Safe area spacing specifically for iOS status bar */
        .ios-safe-top {
            padding-top: calc(env(safe-area-inset-top) + 2rem);
        }
        .ios-safe-modal {
            padding-top: calc(env(safe-area-inset-top) + 0.5rem);
        }
        
        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(24, 24, 27, 0.6); /* zinc-900 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.4);
        }
    </style>
</head>

        // --- 2. STATE MANAGEMENT & UTILS ---
        const defaultState = {
            userName: null, // New field for personalization
            difficulty: 'steady', 
            theme: 'lemon', 
            workouts: [], 
            checkIns: [], 
            achievements: [], 
            profilePic: null,
            startDate: new Date().toISOString()

        const store = {
            data: {},
            load() {
                const saved = localStorage.getItem('mfj_data');
                if (saved) {
                    try {
                        this.data = JSON.parse(saved);
                        if(!this.data.checkIns) this.data.checkIns = [];
                        if(!this.data.workouts) this.data.workouts = [];
                        if(!this.data.achievements) this.data.achievements = [];
                        if(!this.data.theme) this.data.theme = 'lemon';
                        if(this.data.profilePic === undefined) this.data.profilePic = null;
                        if(this.data.userName === undefined) this.data.userName = null;
                    } catch(e) {
                        this.data = JSON.parse(JSON.stringify(defaultState));
                    }
                } else {
                    this.data = JSON.parse(JSON.stringify(defaultState));
                }
                document.documentElement.className = `theme-${this.data.theme}`;
            },
            save() {
                localStorage.setItem('mfj_data', JSON.stringify(this.data));
            },
            getTodayStr() {
                const d = new Date();
                return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            },
            hasCompletedWorkoutToday() {
                const today = this.getTodayStr();
                return this.data.workouts.some(w => w.date.startsWith(today));
            },
            getTodayCheckIn() {
                const today = this.getTodayStr();
                return this.data.checkIns.find(c => c.date.startsWith(today));
            }

            let nameInput = document.getElementById('user-name-input').value.trim();

            modal.classList.remove('flex');
            modal.classList.add('hidden');
            
            checkAchievements();
            router.navigate('home');
            showNotification(`Welcome to Fits, ${store.data.userName}!`);

        function updateUserNameFromSettings() {
            let currentName = store.data.userName || 'King';
            let newName = prompt("What would you like to be called?", currentName);
            if (newName && newName.trim() !== '') {
                store.data.userName = newName.trim();
                store.save();
                renderView(router.current);
                showNotification("Name updated!");
            }
        }

        function calculateStreak() {
            let activeDates = [...new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ])].sort((a, b) => new Date(b) - new Date(a));

            if (activeDates.length === 0) return 0;

            let streak = 0;
            let d = new Date();
            let checkDateStr = store.getTodayStr();
            
            if (!activeDates.includes(checkDateStr)) {
                d.setDate(d.getDate() - 1);
                checkDateStr = d.toISOString().split('T')[0];
                if (!activeDates.includes(checkDateStr)) return 0;
            }

            while(activeDates.includes(checkDateStr)) {
                streak++;
                d.setDate(d.getDate() - 1);
                checkDateStr = d.toISOString().split('T')[0];
            }
            return streak;
        }

        // --- INTENSITY PROGRESSION GOAL CALCULATOR ---
        function getProgressionGoal() {
            const wCount = store.data.workouts.length;
            const current = store.data.difficulty;
            
            if (current === 'easy') {
                const target = 5;
                const progress = Math.min(wCount, target);
                const percentage = Math.round((progress / target) * 100);
                const ready = wCount >= target;
                return {
                    currentLevel: 'Easy',
                    nextLevel: 'Steady',
                    workoutsNeeded: Math.max(0, target - wCount),
                    progress,
                    target,
                    percentage,
                    ready
                };
            } else if (current === 'steady') {
                const target = 15;
                const progress = Math.min(wCount, target);
                const percentage = Math.round((progress / target) * 100);
                const ready = wCount >= target;
                return {
                    currentLevel: 'Steady',
                    nextLevel: 'Hard',
                    workoutsNeeded: Math.max(0, target - wCount),
                    progress,
                    target,
                    percentage,
                    ready
                };
            } else {
                return {
                    currentLevel: 'Hard',
                    nextLevel: 'Max Peak',
                    workoutsNeeded: 0,
                    progress: wCount,
                    target: wCount,
                    percentage: 100,
                    ready: true
                };
            }
        }

        // --- SMART REFLECTION AI COACH ---

            const { activity, water, sleep, energy, notes } = checkIn;

            let feedback = "";

                statusColor = "text-blue-400 bg-blue-950/30 border-blue-900/40";
                feedback = "Recovery is a journey, not a straight line. Give yourself grace today, focus on getting a good night's sleep, and bounce back strong tomorrow!";

                feedback += ` <br><br><span class="italic text-zinc-300">Coach Note on your journal: "${notes}" — Thanks for keeping tabs on how your body feels!</span>`;

        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    store.data.profilePic = canvas.toDataURL('image/jpeg', 0.7);
                    store.save();
                    renderView(router.current);
                    showNotification("Profile picture updated!");
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 3. ACHIEVEMENT LOGIC ---
        function checkAchievements() {
            const unlocked = store.data.achievements.map(a => a.id);
            const today = store.getTodayStr();
            let newUnlocks = [];

            const grant = (id) => {
                if (!unlocked.includes(id)) {
                    store.data.achievements.push({ id, date: today });
                    newUnlocks.push(id);
                }
            };

            const wCount = store.data.workouts.length;
            const uniqueCheckInDates = new Set(store.data.checkIns.map(c => c.date.split('T')[0]));
            const cCount = uniqueCheckInDates.size;
            const uniqueActivityDates = new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ]);
            const aCount = uniqueActivityDates.size;
            const cardioCount = store.data.workouts.filter(w => w.type === 'cardio').length;
            const waterCount = store.data.checkIns.filter(c => c.water).length;
            const isEarly = new Date().getHours() < 9;

            if (wCount >= 1) grant('first_step');
            if (wCount >= 3) grant('rhythm');
            if (wCount >= 5) grant('momentum');
            if (wCount >= 10) grant('double_digits');
            if (wCount >= 20) grant('consistency_champ');
            if (wCount >= 30) grant('strength_builder');
            if (cCount >= 5) grant('showing_up');
            if (aCount >= 14) grant('two_weeks');
            if (cardioCount >= 3) grant('marathon_runner');
            if (waterCount >= 7) grant('hydration_hero');
            if (isEarly && wCount >= 1) grant('early_bird');

            if (!unlocked.includes('weekly_commitment')) {
                const curr = new Date();
                const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
                const monday = new Date(curr.setDate(first));
                monday.setHours(0,0,0,0);
                
                let currentWeekWorkouts = 0;
                store.data.workouts.forEach(w => {
                    const wDate = new Date(w.date);
                    if (wDate >= monday && w.type === 'strength') {
                        currentWeekWorkouts++;
                    }
                });
                if (currentWeekWorkouts >= 3) grant('weekly_commitment');
            }

            if (newUnlocks.length > 0) {
                store.save();
                showNotification(`🏆 Achievement Unlocked: ${MEDALS.find(m=>m.id===newUnlocks[0]).title}!`);
            }
        }

            const goal = getProgressionGoal();

                if (!confirm("You haven't completed 5 workouts yet. Are you sure you want to skip straight to Hard?")) {
                    return;
                }
            }
            store.data.difficulty = level;
            store.save();
            renderSettings(document.getElementById('view-settings'));
            showNotification(`Difficulty set to ${level.charAt(0).toUpperCase() + level.slice(1)}`);

        // --- 6. WORKOUT SESSION & WARMUP LOGIC ---

            const todayNum = new Date().getDay();

                    return;

                exIndex: 0,

                    const ex = EXERCISE_DB[exKey];
                    const params = ex.levels[store.data.difficulty];
                    return { id: exKey, name: ex.name, sets: params.sets, reps: params.label, completedSets: 0 };

            overlay.classList.remove('hidden');
            renderWarmup();

        function completeSet(index) {
            const exData = activeWorkout.exercises[activeWorkout.exIndex];

                exData.completedSets++;
                renderActiveWorkout();
                
                const isLastEx = activeWorkout.exIndex === activeWorkout.exercises.length - 1;
                const isLastSet = exData.completedSets === exData.sets;
                if (!(isLastEx && isLastSet) && exData.id !== 'jogging') {
                    startRestTimer();

            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            const btn = document.getElementById('next-ex-btn');
            if (exData.completedSets === exData.sets) {
                btn.disabled = false;
                btn.className = "w-full bg-brand-main text-brand-contrast rounded-full py-4 font-bold shadow-xl shadow-brand-main/30 active:scale-95 transition-transform tracking-wide text-sm flex items-center justify-center gap-2 border border-white/20";
            }
        }

        function startRestTimer() {
            const timerEl = document.getElementById('rest-timer');
            const displayEl = document.getElementById('timer-display');
            timerEl.classList.remove('hidden');
            timerEl.classList.add('flex');
            
            let time = store.data.difficulty === 'easy' ? 60 : (store.data.difficulty === 'steady' ? 45 : 30);
            displayEl.innerText = time;
            
            restInterval = setInterval(() => {
                time--;
                displayEl.innerText = time;
                if (time <= 0) {
                    skipRest();
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(restInterval);
            const timerEl = document.getElementById('rest-timer');
            timerEl.classList.add('hidden');
            timerEl.classList.remove('flex');
        }

        function nextExercise() {
            if (activeWorkout.exIndex < activeWorkout.exercises.length - 1) {
                activeWorkout.exIndex++;
                renderActiveWorkout();
            } else {
                finishWorkout();
            }
        }

        function finishWorkout() {
            if(!store.hasCompletedWorkoutToday()) {
                store.data.workouts.push({
                    date: store.getTodayStr(),
                    type: activeWorkout.plan.type,
                    title: activeWorkout.plan.title,
                    difficulty: store.data.difficulty,
                    exercises: activeWorkout.exercises.map(ex => ({
                        name: ex.name,
                        sets: ex.completedSets,
                        reps: ex.reps
                    }))
                });
                store.save();
                checkAchievements();
            }
            
            closeWorkoutSession();
            showCompletionScreen();
        }

        function confirmExitWorkout() {
            if (confirm("Are you sure you want to end this workout early? Progress won't be saved.")) {
                closeWorkoutSession();
            }
        }

        function closeWorkoutSession() {
            clearInterval(restInterval);
            const overlay = document.getElementById('workout-session');
            overlay.classList.add('hidden');
            const completeOverlay = document.getElementById('workout-complete');
            completeOverlay.classList.add('hidden');
        }

        function showCompletionScreen() {
            const totalSets = activeWorkout.exercises.reduce((acc, curr) => acc + curr.completedSets, 0);
            const exCount = activeWorkout.exercises.length;
            
            const overlay = document.getElementById('workout-complete');
            overlay.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-zinc-950 h-full relative overflow-hidden">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--brand-bg)_0%,_transparent_70%)] opacity-40"></div>
                    
                    <div class="relative z-10 w-full flex flex-col items-center">
                        <div class="w-32 h-32 bg-brand-bg/50 rounded-full flex items-center justify-center mb-8 border-4 border-brand-muted shadow-[0_0_40px_var(--brand-bg)] backdrop-blur-md">
                            <i data-lucide="check" class="w-16 h-16 text-brand-main"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">Workout Complete!</h2>
                        <p class="text-zinc-400 text-sm mb-8">${activeWorkout.plan.title} successfully logged.</p>
                        
                        <div class="glass-card rounded-[2rem] p-6 w-full max-w-sm mb-8 space-y-4 text-left">
                            <div class="flex justify-between items-center"><span class="text-zinc-400 text-sm">Exercises finished</span><span class="font-bold text-white text-sm">${exCount}</span></div>
                            <div class="flex justify-between items-center"><span class="text-zinc-400 text-sm">Total sets logged</span><span class="font-bold text-white text-sm">${totalSets}</span></div>
                            <div class="flex justify-between items-center"><span class="text-zinc-400 text-sm">Difficulty level</span><span class="font-bold text-brand-main text-sm capitalize">${store.data.difficulty}</span></div>
                        </div>

                        <div class="w-full max-w-sm space-y-3">
                            <button onclick="closeWorkoutSession(); router.navigate('home');" class="w-full bg-brand-main text-brand-contrast rounded-full py-4 font-bold shadow-xl shadow-brand-main/20 active:scale-95 transition-transform text-sm tracking-wide border border-white/20">Return to Dashboard</button>
                            <button onclick="closeWorkoutSession(); openCheckIn();" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-full py-4 font-bold active:scale-95 transition-transform text-sm tracking-wide">Log Daily Reflection</button>
                        </div>
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
            lucide.createIcons();
        }

        function openExerciseGuide() {
            const overlay = document.getElementById('workout-session');
            let guideHtml = `
                <div class="flex-1 flex flex-col bg-zinc-950 h-full">
                    <div class="px-5 py-4 flex items-center justify-between glass-card sticky top-0 z-20 border-b border-zinc-800/50">
                        <div class="flex items-center gap-2">
                            <div class="bg-brand-main text-brand-contrast p-2 rounded-full"><i data-lucide="book-open" class="w-4 h-4"></i></div>
                            <h2 class="text-lg font-bold text-white tracking-tight">Exercise Library</h2>
                        </div>
                        <button onclick="closeWorkoutSession()" class="text-zinc-500 hover:text-white p-2 -mr-2 bg-zinc-900 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-6 pb-24 space-y-6">
                        <p class="text-zinc-400 text-sm">Master your technique with these visual breakdowns and detailed instructions for every movement.</p>
            `;

            for (const [key, ex] of Object.entries(EXERCISE_DB)) {
                guideHtml += `
                    <div class="glass-card rounded-[2rem] border border-zinc-800/60 overflow-hidden">
                        <div class="h-44 w-full relative overflow-hidden bg-zinc-900">
                            <img src="${ex.img}" alt="${ex.name}" class="w-full h-full object-cover opacity-80 hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/18181b/e0ff33?text=Fits'">
                            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/20 to-transparent"></div>
                            <span class="absolute bottom-3 left-4 text-[10px] font-bold text-brand-main bg-brand-bg px-3 py-1 rounded-full border border-brand-muted uppercase">${ex.target}</span>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-white text-base tracking-tight mb-2">${ex.name}</h3>
                            <p class="text-zinc-300 text-sm mb-4 leading-relaxed">${ex.desc}</p>
                            <div class="bg-zinc-950/60 p-4 rounded-[1.25rem] border border-zinc-800/50">
                                <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-1">Beginner Alternative</p>
                                <p class="text-xs text-zinc-400 leading-relaxed">${ex.alt}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            guideHtml += `
                    </div>
                </div>
            `;
            overlay.innerHTML = guideHtml;
            overlay.classList.remove('hidden');
            lucide.createIcons();
        }

        // --- 7. CHECK-IN LOGIC ---
        function openCheckIn(editDate = null) {
            const dateToEdit = editDate || store.getTodayStr();
            const existing = store.data.checkIns.find(c => c.date.startsWith(dateToEdit));
            const isToday = dateToEdit === store.getTodayStr();
            
            const overlay = document.getElementById('workout-session');
            overlay.innerHTML = `
                <div class="flex-1 flex flex-col bg-zinc-950 h-full">
                    <div class="px-5 py-4 flex items-center justify-between glass-card sticky top-0 z-20 border-b border-zinc-800/50">
                        <h2 class="text-lg font-bold text-white tracking-tight">${isToday ? 'Daily Reflection' : 'Edit Reflection'}</h2>
                        <button onclick="closeWorkoutSession()" class="text-zinc-500 hover:text-white p-2 -mr-2 bg-zinc-900 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-6 pb-24">
                        <p class="text-zinc-400 text-sm mb-8">Take a moment to reflect on your day. Honesty is key to progress.</p>
                        
                        <div class="space-y-4 mb-8">
                            <label class="flex items-start gap-4 glass-card p-5 rounded-[1.5rem] border border-zinc-800/50 cursor-pointer custom-checkbox transition-all hover:bg-zinc-900">
                                <input type="checkbox" id="chk-activity" class="sr-only" ${existing?.activity ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-full border-2 border-zinc-600 flex-shrink-0 flex items-center justify-center mt-0.5 bg-zinc-800 transition-colors shadow-inner">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-white text-sm tracking-tight">I completed today's plan</p>
                                    <p class="text-xs text-zinc-500 mt-0.5">Workout or designated recovery.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-4 glass-card p-5 rounded-[1.5rem] border border-zinc-800/50 cursor-pointer custom-checkbox transition-all hover:bg-zinc-900">
                                <input type="checkbox" id="chk-water" class="sr-only" ${existing?.water ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-full border-2 border-zinc-600 flex-shrink-0 flex items-center justify-center mt-0.5 bg-zinc-800 transition-colors shadow-inner">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-white text-sm tracking-tight">I drank enough water</p>
                                    <p class="text-xs text-zinc-500 mt-0.5">Staying hydrated supports muscle growth.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-4 glass-card p-5 rounded-[1.5rem] border border-zinc-800/50 cursor-pointer custom-checkbox transition-all hover:bg-zinc-900">
                                <input type="checkbox" id="chk-sleep" class="sr-only" ${existing?.sleep ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-full border-2 border-zinc-600 flex-shrink-0 flex items-center justify-center mt-0.5 bg-zinc-800 transition-colors shadow-inner">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-white text-sm tracking-tight">I made time for adequate sleep</p>
                                    <p class="text-xs text-zinc-500 mt-0.5">Recovery happens while you rest.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-4 glass-card p-5 rounded-[1.5rem] border border-zinc-800/50 cursor-pointer custom-checkbox transition-all hover:bg-zinc-900">
                                <input type="checkbox" id="chk-energy" class="sr-only" ${existing?.energy ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-full border-2 border-zinc-600 flex-shrink-0 flex items-center justify-center mt-0.5 bg-zinc-800 transition-colors shadow-inner">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-white text-sm tracking-tight">My energy levels felt good</p>
                                    <p class="text-xs text-zinc-500 mt-0.5">Checking in with your body.</p>
                                </div>
                            </label>
                        </div>
                        
                        <div class="glass-card p-5 rounded-[2rem] border border-zinc-800/50 mb-8">
                            <h3 class="font-bold text-white text-sm mb-3 tracking-tight">Personal Notes</h3>
                            <textarea id="chk-notes" class="w-full bg-zinc-950/80 rounded-[1rem] p-4 text-sm text-white border border-zinc-800 focus:border-brand-main focus:ring-1 focus:ring-brand-main outline-none resize-none hide-scrollbar placeholder-zinc-600 shadow-inner" rows="4" placeholder="How did today feel? Any struggles or wins?">${existing?.notes || ''}</textarea>
                        </div>
                        
                        <button onclick="saveCheckIn('${dateToEdit}')" class="w-full bg-brand-main text-brand-contrast rounded-full py-4 font-bold shadow-xl shadow-brand-main/20 active:scale-95 transition-transform tracking-wide text-sm border border-transparent hover:border-white/20">Save Reflection</button>
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
            lucide.createIcons();
            
            if (!existing && store.hasCompletedWorkoutToday() && isToday) {
                document.getElementById('chk-activity').checked = true;
            }
        }

        function saveCheckIn(dateStr) {
            const index = store.data.checkIns.findIndex(c => c.date.startsWith(dateStr));
            const newRecord = {
                date: dateStr,
                activity: document.getElementById('chk-activity').checked,
                water: document.getElementById('chk-water').checked,
                sleep: document.getElementById('chk-sleep').checked,
                energy: document.getElementById('chk-energy').checked,
                notes: document.getElementById('chk-notes').value.trim()
            };

            if (index !== -1) {
                store.data.checkIns[index] = newRecord; 
            } else {
                store.data.checkIns.push(newRecord); 
            }
            
            store.save();
            checkAchievements();
            closeWorkoutSession();
            showNotification("Reflection saved & analyzed!");
            if(router.current === 'progress') { renderProgress(document.getElementById('view-progress')); }
            else { router.navigate('home'); }
        }

        // --- 8. UTILITIES (Export/Import/ICS) ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "fits_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.workouts) && Array.isArray(imported.checkIns)) {
                        if(confirm("Importing will overwrite your current progress. Continue?")) {
                            store.data = imported;
                            if(!store.data.achievements) store.data.achievements = [];
                            if(!store.data.theme) store.data.theme = 'lemon';
                            if(store.data.profilePic === undefined) store.data.profilePic = null;
                            if(store.data.userName === undefined) store.data.userName = null;
                            store.save();
                            document.documentElement.className = `theme-${store.data.theme}`;
                            checkAchievements(); 
                            showNotification("Data imported successfully!");
                            router.navigate('home');
                        }
                    } else {
                        alert("Invalid backup file format. Progress was not changed.");
                    }
                } catch (err) {
                    alert("Error reading file. Make sure it's a valid JSON backup.");
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm("Are you absolutely sure you want to delete ALL progress? This cannot be undone.")) {
                localStorage.removeItem('mfj_data');
                store.load();
                router.navigate('home');
                showNotification("All data has been reset.");
            }
        }

        function downloadICS() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dtStart = `${yyyy}${mm}${dd}T070000`; 

            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Fits//EN
BEGIN:VEVENT
SUMMARY:Morning Fitness Reflection
DESCRIPTION:Time to show up for yourself. Let's build strength one day at a time.
RRULE:FREQ=DAILY
DTSTART:${dtStart}
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:Morning Fitness Reflection Reminder
TRIGGER:-PT0M
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fits-reminder.ics';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setTimeout(() => {
                alert("iPhone Installation:\n\n1. Safari will prompt you to download the file.\n2. Tap 'Download'.\n3. Tap the Downloads icon (↓) in the Safari address bar, open the file, and tap 'Add All' to save the recurring reminder with an alarm.");
            }, 600);
        }

    </script>
