    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fits">
    <title>Fits</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon.png?v=4">
    <link rel="apple-touch-icon" href="icon.png?v=4">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            main: 'var(--brand-main)',
                            bg: 'var(--brand-bg)',
                            contrast: 'var(--brand-contrast)',
                            muted: 'var(--brand-muted)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* THEME VARIABLES */
        :root, .theme-lemon {
            --brand-main: #e0ff33; /* Neon Lemon */
            --brand-bg: #222a00;
            --brand-contrast: #000000;
            --brand-muted: #5e7300;
        }
        .theme-purple {
            --brand-main: #a78bfa;
            --brand-bg: #2e1a47;
            --brand-contrast: #000000;
            --brand-muted: #6d28d9;
        }
        .theme-cyan {
            --brand-main: #22d3ee;
            --brand-bg: #083344;
            --brand-contrast: #000000;
            --brand-muted: #0e7490;
        }
        .theme-rose {
            --brand-main: #fb7185;
            --brand-bg: #4c0519;
            --brand-contrast: #000000;
            --brand-muted: #be123c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #f4f4f5; /* zinc-100 */
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up-modal { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Custom Checkbox - Fully Rounded Now */
        .custom-checkbox input:checked + div {
            background-color: var(--brand-main);
            border-color: var(--brand-main);
        }
        .custom-checkbox input:checked + div svg { 
            display: block; 
            color: var(--brand-contrast);
        }
        
        /* Activity Heatmap Graph */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            border-radius: 9999px; /* Pill shaped cells */
        }

        /* Safe area spacing specifically for iOS status bar */
        .ios-safe-top {
            padding-top: calc(env(safe-area-inset-top) + 2rem);
        }
        .ios-safe-modal {
            padding-top: calc(env(safe-area-inset-top) + 0.5rem);
        }
        
        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(24, 24, 27, 0.6); /* zinc-900 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.4);
        }

        /* Pet Floating & Pulse Animations */
        @keyframes floatPet {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .pet-float {
            animation: floatPet 3s ease-in-out infinite;
        }
        @keyframes popScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-2deg); }
            40% { transform: translateX(8px) rotate(2deg); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .hit-shake {
            animation: hitShake 0.35s ease-in-out;
        }
    </style>
</head>

        // --- STREAK & 3X STREAK RESTORE ENGINE ---
        function getAllActiveDates() {
            return [...new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ])].sort((a, b) => new Date(b) - new Date(a));
        }

        function shiftDateStr(dateStr, daysDelta) {
            const parts = dateStr.split('-').map(Number);
            const d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
            d.setUTCDate(d.getUTCDate() + daysDelta);
            return d.toISOString().split('T')[0];
        }

        function findBridgeContaining(dateStr) {
            const bridges = store.data.streakBridges || [];
            return bridges.find(b => dateStr >= b.from && dateStr <= b.to);
        }

        function countStreakFromAnchor(anchorDateStr, activeSet) {
            let count = 0;
            let curr = anchorDateStr;
            let safety = 0;

            while (safety < 3650) {
                safety++;
                if (activeSet.has(curr)) {
                    count++;
                    curr = shiftDateStr(curr, -1);
                } else {
                    const bridge = findBridgeContaining(curr);
                    if (bridge && bridge.from < curr) {
                        curr = bridge.from;
                    } else {
                        break;
                    }
                }
            }
            return count;
        }

        function getStreakStatus() {
            const activeDates = getAllActiveDates();
            const activeSet = new Set(activeDates);
            const todayStr = store.getTodayStr();
            const yesterdayStr = shiftDateStr(todayStr, -1);
            const restoresLeft = store.data.streakRestores !== undefined ? store.data.streakRestores : 3;

            if (activeDates.length === 0) {
                return { streak: 0, canRestore: false, lostStreakCount: 0, restoresLeft, lastActiveDate: null };
            }

            // Check if streak is currently alive (active today, active yesterday, or yesterday is bridged)
            const isTodayAlive = activeSet.has(todayStr) || !!findBridgeContaining(todayStr);
            const isYesterdayAlive = activeSet.has(yesterdayStr) || !!findBridgeContaining(yesterdayStr);

            if (isTodayAlive) {
                return {
                    streak: countStreakFromAnchor(todayStr, activeSet),
                    canRestore: false,
                    lostStreakCount: 0,
                    restoresLeft,
                    lastActiveDate: activeDates[0]
                };
            }

            if (isYesterdayAlive) {
                return {
                    streak: countStreakFromAnchor(yesterdayStr, activeSet),
                    canRestore: false,
                    lostStreakCount: 0,
                    restoresLeft,
                    lastActiveDate: activeDates[0]
                };
            }

            // Otherwise, the user has missed at least 1 full day and their streak is frozen/broken!
            const lastActive = activeDates[0];
            const lostStreakCount = countStreakFromAnchor(lastActive, activeSet);

            return {
                streak: 0,
                canRestore: lostStreakCount > 0 && restoresLeft > 0,
                lostStreakCount,
                restoresLeft,
                lastActiveDate: lastActive
            };
        }

        function calculateStreak() {
            return getStreakStatus().streak;
        }

        function restoreLostStreak() {
            const status = getStreakStatus();
            if (!status.canRestore || status.restoresLeft <= 0) return;

            const yesterdayStr = shiftDateStr(store.getTodayStr(), -1);
            store.data.streakBridges.push({
                from: status.lastActiveDate,
                to: yesterdayStr
            });
            store.data.streakRestores = status.restoresLeft - 1;
            store.save();

            checkAchievements();
            renderView(router.current);
            showNotification(`🔥 ${status.lostStreakCount}-Day Streak Restored! (${store.data.streakRestores}/3 left)`);
        }

        // --- INTENSITY PROGRESSION GOAL CALCULATOR ---
        function getProgressionGoal() {
            const wCount = store.data.workouts.length;
            const current = store.data.difficulty;
            
            const levels = [
                { id: 'starter', name: 'Starter', target: 5 },
                { id: 'easy', name: 'Easy', target: 15 },
                { id: 'steady', name: 'Steady', target: 30 },
                { id: 'hard', name: 'Hard', target: 50 },
                { id: 'elite', name: 'Elite', target: 50 } // Elite is the cap
            ];

            let currentIndex = levels.findIndex(l => l.id === current);
            if (currentIndex === -1) currentIndex = 2; // Default to steady if missing
            
            const currentLevelObj = levels[currentIndex];

            if (currentIndex < levels.length - 1) {
                const nextLevelObj = levels[currentIndex + 1];
                const target = currentLevelObj.target;
                const progress = Math.min(wCount, target);
                const percentage = Math.round((progress / target) * 100);
                const ready = wCount >= target;
                
                return {
                    currentLevel: currentLevelObj.name,
                    nextLevel: nextLevelObj.name,
                    workoutsNeeded: Math.max(0, target - wCount),
                    progress,
                    target,
                    percentage,
                    ready
                };
            } else {
                return {
                    currentLevel: 'Elite',
                    nextLevel: 'Max Peak',
                    workoutsNeeded: 0,
                    progress: wCount,
                    target: wCount,
                    percentage: 100,
                    ready: true
                };
            }
        }

        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    store.data.profilePic = canvas.toDataURL('image/jpeg', 0.7);
                    store.save();
                    renderView(router.current);
                    showNotification("Profile picture updated!");
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 3. ACHIEVEMENT LOGIC ---
        function checkAchievements() {
            const unlocked = store.data.achievements.map(a => a.id);
            const today = store.getTodayStr();
            let newUnlocks = [];

            const grant = (id) => {
                if (!unlocked.includes(id)) {
                    const medal = MEDALS.find(m => m.id === id);
                    store.data.achievements.push({ id, date: today });
                    if (medal && medal.reward) {
                        store.data.coins = (store.data.coins || 0) + medal.reward;
                    }
                    newUnlocks.push(id);
                }
            };

            const wCount = store.data.workouts.length;
            const uniqueCheckInDates = new Set(store.data.checkIns.map(c => c.date.split('T')[0]));
            const cCount = uniqueCheckInDates.size;
            const uniqueActivityDates = new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ]);
            const aCount = uniqueActivityDates.size;
            const cardioCount = store.data.workouts.filter(w => w.type === 'cardio').length;
            const waterCount = store.data.checkIns.filter(c => c.water).length;
            const notesCount = store.data.checkIns.filter(c => c.notes && c.notes.trim().length > 5).length;
            const hourNow = new Date().getHours();
            const isEarly = hourNow < 9;
            const isLate = hourNow >= 20;

            if (wCount >= 1) grant('first_step');
            if (wCount >= 3) grant('rhythm');
            if (wCount >= 5) grant('momentum');
            if (wCount >= 10) grant('double_digits');
            if (wCount >= 20) grant('consistency_champ');
            if (wCount >= 30) grant('strength_builder');
            if (wCount >= 50) grant('half_century');
            if (cCount >= 5) grant('showing_up');
            if (aCount >= 14) grant('two_weeks');
            if (cardioCount >= 3) grant('marathon_runner');
            if (waterCount >= 7) grant('hydration_hero');
            if (notesCount >= 5) grant('journal_master');
            if (isEarly && (wCount >= 1 || cCount >= 1)) grant('early_bird');
            if (isLate && (wCount >= 1 || cCount >= 1)) grant('night_owl');
            if ((store.data.streakBridges || []).length > 0) grant('phoenix_rising');
            if ((store.data.microWorkouts || 0) >= 1) grant('anti_procrastinator');

            const pet = store.data.pet || {};
            if (pet.hat !== 'none' || pet.glasses !== 'none' || pet.gear !== 'none' || pet.aura !== 'none') {
                grant('fashionista');
            }

            // Weekend warrior check (both Sat=6 and Sun=0 present in activity dates)
            const daysOfWeekActive = new Set([...uniqueActivityDates].map(dStr => {
                const p = dStr.split('-').map(Number);
                return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
            }));
            if (daysOfWeekActive.has(6) && daysOfWeekActive.has(0)) grant('weekend_warrior');

            // Quadruple threat check
            const todayCheck = store.getTodayCheckIn();
            if (todayCheck && todayCheck.activity && todayCheck.water && todayCheck.sleep && todayCheck.energy && store.hasCompletedWorkoutToday()) {
                grant('perfect_day');
            }

            if (!unlocked.includes('weekly_commitment')) {
                const curr = new Date();
                const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
                const monday = new Date(curr.setDate(first));
                monday.setHours(0,0,0,0);
                
                let currentWeekWorkouts = 0;
                store.data.workouts.forEach(w => {
                    const wDate = new Date(w.date);
                    if (wDate >= monday && w.type === 'strength') {
                        currentWeekWorkouts++;
                    }
                });
                if (currentWeekWorkouts >= 3) grant('weekly_commitment');
            }

            if (newUnlocks.length > 0) {
                store.save();
                const firstMedal = MEDALS.find(m => m.id === newUnlocks[0]);
                showNotification(`🏆 Unlocked: ${firstMedal.title} (+${firstMedal.reward} Coins!)`);
            }
        }

        function buyOrEquipPetItem(category, itemId) {
            const item = PET_SHOP[category].find(i => i.id === itemId);
            if (!item) return;
            const key = `${category}:${itemId}`;
            const pet = store.data.pet;

            if (pet.unlocked.includes(key) || item.cost === 0) {
                pet[category] = itemId;
                store.save();
                checkAchievements();
                openPetStudio(category);
                showNotification(`Equipped ${item.name}!`);
            } else {
                if ((store.data.coins || 0) < item.cost) {
                    showInfoModal("Not Enough FitCoins", `You need ${item.cost} FitCoins for ${item.name}. Complete workouts, 2-minute sparks, or unlock medals to earn more!`);
                    return;
                }
                showConfirmModal("Unlock Style Item", `Spend ${item.cost} FitCoins to unlock ${item.name}?`, () => {
                    store.data.coins -= item.cost;
                    pet.unlocked.push(key);
                    pet[category] = itemId;
                    store.save();
                    checkAchievements();
                    openPetStudio(category);
                    showNotification(`🎉 Unlocked & Equipped ${item.name}!`);
                }, `Unlock (${item.cost} 🪙)`);
            }

        // --- 3. ACHIEVEMENT LOGIC ---
        function checkAchievements() {
            const unlocked = store.data.achievements.map(a => a.id);
            const today = store.getTodayStr();
            let newUnlocks = [];

            const grant = (id) => {
                if (!unlocked.includes(id)) {
                    const medal = MEDALS.find(m => m.id === id);
                    store.data.achievements.push({ id, date: today });
                    if (medal && medal.reward) {
                        store.data.coins = (store.data.coins || 0) + medal.reward;
                    }
                    newUnlocks.push(id);
                }
            };

            const wCount = store.data.workouts.length;
            const uniqueCheckInDates = new Set(store.data.checkIns.map(c => c.date.split('T')[0]));
            const cCount = uniqueCheckInDates.size;
            const uniqueActivityDates = new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ]);
            const aCount = uniqueActivityDates.size;
            const cardioCount = store.data.workouts.filter(w => w.type === 'cardio').length;
            const waterCount = store.data.checkIns.filter(c => c.water).length;
            const notesCount = store.data.checkIns.filter(c => c.notes && c.notes.trim().length > 5).length;
            const hourNow = new Date().getHours();
            const isEarly = hourNow < 9;
            const isLate = hourNow >= 20;

            if (wCount >= 1) grant('first_step');
            if (wCount >= 3) grant('rhythm');
            if (wCount >= 5) grant('momentum');
            if (wCount >= 10) grant('double_digits');
            if (wCount >= 20) grant('consistency_champ');
            if (wCount >= 30) grant('strength_builder');
            if (wCount >= 50) grant('half_century');
            if (cCount >= 5) grant('showing_up');
            if (aCount >= 14) grant('two_weeks');
            if (cardioCount >= 3) grant('marathon_runner');
            if (waterCount >= 7) grant('hydration_hero');
            if (notesCount >= 5) grant('journal_master');
            if (isEarly && (wCount >= 1 || cCount >= 1)) grant('early_bird');
            if (isLate && (wCount >= 1 || cCount >= 1)) grant('night_owl');
            if ((store.data.streakBridges || []).length > 0) grant('phoenix_rising');
            if ((store.data.microWorkouts || 0) >= 1) grant('anti_procrastinator');
            if ((store.data.battlesWon || 0) >= 1) grant('first_victory');
            if ((store.data.battlesWon || 0) >= 5) grant('boss_slayer');

            const pet = store.data.pet || {};
            if (pet.hat !== 'none' || pet.glasses !== 'none' || pet.gear !== 'none' || pet.aura !== 'none') {
                grant('fashionista');
            }

            const daysOfWeekActive = new Set([...uniqueActivityDates].map(dStr => {
                const p = dStr.split('-').map(Number);
                return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
            }));
            if (daysOfWeekActive.has(6) && daysOfWeekActive.has(0)) grant('weekend_warrior');

            const todayCheck = store.getTodayCheckIn();
            if (todayCheck && todayCheck.activity && todayCheck.water && todayCheck.sleep && todayCheck.energy && store.hasCompletedWorkoutToday()) {
                grant('perfect_day');
            }

            if (!unlocked.includes('weekly_commitment')) {
                const curr = new Date();
                const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
                const monday = new Date(curr.setDate(first));
                monday.setHours(0,0,0,0);
                
                let currentWeekWorkouts = 0;
                store.data.workouts.forEach(w => {
                    const wDate = new Date(w.date);
                    if (wDate >= monday && w.type === 'strength') {
                        currentWeekWorkouts++;
                    }
                });
                if (currentWeekWorkouts >= 3) grant('weekly_commitment');
            }

            if (newUnlocks.length > 0) {
                store.save();
                const firstMedal = MEDALS.find(m => m.id === newUnlocks[0]);
                showNotification(`🏆 Unlocked: ${firstMedal.title} (+${firstMedal.reward} Coins!)`);
            }
        }

        ];

        function getFighterCombatStats() {
            const stage = store.data.difficulty || 'steady';
            const stageIdx = Math.max(0, STAGE_TIERS.indexOf(stage));
            const wCount = store.data.workouts.length;
            const cCount = new Set(store.data.checkIns.map(c => c.date.split('T')[0])).size;
            const streak = calculateStreak();
            const pet = store.data.pet || defaultState.pet;

            let gearAtk = 0;
            let gearDef = 0;
            if (pet.gear === 'dumbbell') gearAtk += 8;
            if (pet.gear === 'chain') gearAtk += 5;
            if (pet.gear === 'cape') gearDef += 8;
            if (pet.hat !== 'none') gearDef += 4;
            if (pet.aura !== 'none') gearAtk += 6;

            const maxHp = 100 + (wCount * 12) + (stageIdx * 45);
            const atk = 18 + (wCount * 3) + (stageIdx * 11) + gearAtk;
            const def = 6 + (cCount * 2) + (stageIdx * 6) + gearDef;
            const critChance = Math.min(10 + (streak * 4), 45);

            return { stage, stageIdx, maxHp, atk, def, critChance, buildLabel: BODY_BUILD_SPECS[stage].label };
        }

        function getPetLevelInfo() {
            const xp = store.data.xp || 0;
            const level = Math.floor(xp / 250) + 1;
            const currentLevelXp = xp % 250;
            const pct = Math.round((currentLevelXp / 250) * 100);
            const stageName = (store.data.difficulty || 'steady').toUpperCase();
            return { level, xp, currentLevelXp, pct, title: `${stageName} PHYSIQUE` };
        }

        function renderPetSVG(size = 110, opts = {}) {
            const pet = store.data.pet || defaultState.pet;
            const gender = opts.gender || store.data.gender || 'male';
            const stage = opts.stage || store.data.difficulty || 'steady';
            const build = BODY_BUILD_SPECS[stage] || BODY_BUILD_SPECS.steady;
            const specObj = PET_SHOP.species.find(s => s.id === pet.species) || PET_SHOP.species[0];
            const accent = specObj.primary;
            const accentDark = specObj.secondary;

            const skin = gender === 'male' ? '#d99b72' : '#e4ab84';
            const skinShadow = gender === 'male' ? '#b87a52' : '#c48862';

            const sw = gender === 'male' ? build.shoulderW : Math.round(build.shoulderW * 0.86);
            const ww = gender === 'male' ? build.waistW : Math.round(build.waistW * 0.82);
            const aw = gender === 'male' ? build.armW : Math.max(6.5, build.armW * 0.82);
            const lw = gender === 'male' ? build.legW : build.legW * 0.94;

            let auraSvg = '';
            if (pet.aura === 'flame') {
                auraSvg = `<circle cx="100" cy="108" r="82" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="14 8" opacity="0.75"/>

            } else if (pet.aura === 'lightning') {
                auraSvg = `<circle cx="100" cy="108" r="82" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-dasharray="22 6 6 6" opacity="0.85"/>

                           <path d="M172 55 L156 76 L168 82 L154 105" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/>`;
            } else if (pet.aura === 'stars' || stage === 'elite') {
                auraSvg = `<circle cx="100" cy="108" r="80" fill="${accent}" opacity="0.13"/>

                           <circle cx="28" cy="135" r="3" fill="#22d3ee"/><circle cx="172" cy="130" r="3.5" fill="${accent}"/>`;
            }

            // Hair based on gender
            const hairSvg = gender === 'male'
                ? `<path d="M78,34 Q82,16 100,16 Q118,16 122,34 Q112,25 100,26 Q88,25 78,34 Z" fill="#18181b"/>`
                : `<path d="M116,24 Q138,22 142,46 Q130,42 122,34 Z" fill="#18181b"/>
                   <path d="M77,36 Q80,15 100,15 Q120,15 123,36 Q112,24 100,24 Q88,24 77,36 Z" fill="#18181b"/>`;

            // Headwear
            let hatSvg = '';
            if (pet.hat === 'sweatband') {
                hatSvg = `<rect x="78" y="30" width="44" height="6" rx="3" fill="${accent}"/>`;
            } else if (pet.hat === 'cap') {
                hatSvg = `<path d="M78,30 C78,14 122,14 122,30 Z" fill="#27272a" stroke="${accent}" stroke-width="1.5"/>
                          <rect x="68" y="27" width="26" height="5" rx="2.5" fill="#18181b"/>`;
            } else if (pet.hat === 'crown') {
                hatSvg = `<polygon points="82,22 86,6 94,16 100,4 106,16 114,6 118,22" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>`;
            } else if (pet.hat === 'halo') {
                hatSvg = `<ellipse cx="100" cy="10" rx="22" ry="5" fill="none" stroke="#fde047" stroke-width="3.5"/>`;
            }

            // Eyewear
            let glassesSvg = '';
            if (pet.glasses === 'shades') {
                glassesSvg = `<rect x="83" y="37" width="14" height="8" rx="2" fill="#09090b" stroke="#ffffff" stroke-width="1.2"/>
                              <rect x="103" y="37" width="14" height="8" rx="2" fill="#09090b" stroke="#ffffff" stroke-width="1.2"/>
                              <line x1="97" y1="40" x2="103" y2="40" stroke="#ffffff" stroke-width="1.5"/>`;
            } else if (pet.glasses === 'visor') {
                glassesSvg = `<rect x="80" y="36" width="40" height="9" rx="4.5" fill="#22d3ee" opacity="0.88" stroke="#ffffff" stroke-width="1.2"/>`;
            } else if (pet.glasses === 'monocle') {
                glassesSvg = `<circle cx="109" cy="41" r="7" fill="rgba(255,255,255,0.15)" stroke="#facc15" stroke-width="2"/>`;
            }

            // Gear
            let gearSvg = '';
            if (pet.gear === 'dumbbell') {
                gearSvg = `<g transform="translate(${100 + sw/2 + 8}, 92) rotate(-20)">
                             <rect x="6" y="8" width="20" height="5" rx="2" fill="#a1a1aa"/>
                             <rect x="1" y="2" width="7" height="17" rx="2" fill="${accent}" stroke="#09090b" stroke-width="1"/>
                             <rect x="24" y="2" width="7" height="17" rx="2" fill="${accent}" stroke="#09090b" stroke-width="1"/>
                           </g>`;
            } else if (pet.gear === 'chain') {
                gearSvg = `<path d="M88,68 Q100,82 112,68" fill="none" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>
                           <circle cx="100" cy="77" r="4" fill="#facc15"/>`;
            } else if (pet.gear === 'cape') {
                gearSvg = `<path d="M${100 - sw/2},68 L54,158 L146,158 L${100 + sw/2},68 Z" fill="#ef4444" opacity="0.88"/>`;
            }

            // Torso & Athletic Gear
            const torsoPath = `M${100 - sw/2},68 L${100 + sw/2},68 L${100 + ww/2},116 L${100 - ww/2},116 Z`;
            const outfitSvg = gender === 'male'
                ? `<path d="M${100 - sw/2 + 5},68 L${100 - sw/2 + 13},68 L${100 - ww/2 + 2},116 L${100 - ww/2},116 Z" fill="${accent}" opacity="0.9"/>
                   <path d="M${100 + sw/2 - 5},68 L${100 + sw/2 - 13},68 L${100 + ww/2 - 2},116 L${100 + ww/2},116 Z" fill="${accent}" opacity="0.9"/>
                   <rect x="${100 - ww/2 - 1}" y="114" width="${ww + 2}" height="24" rx="5" fill="#18181b" stroke="${accent}" stroke-width="1.5"/>`
                : `<path d="M${100 - sw/2 + 4},68 L${100 + sw/2 - 4},68 L${100 + ww/2 + 2},92 L${100 - ww/2 - 2},92 Z" fill="${accent}"/>
                   <rect x="${100 - ww/2 - 2}" y="112" width="${ww + 4}" height="24" rx="6" fill="#18181b" stroke="${accent}" stroke-width="1.5"/>`;

            const muscleSvg = build.muscleLines ? `
                <line x1="100" y1="74" x2="100" y2="110" stroke="${skinShadow}" stroke-width="1.6" opacity="0.65"/>
                <path d="M${100 - sw/4},82 Q100,87 ${100 + sw/4},82" fill="none" stroke="${skinShadow}" stroke-width="1.6" opacity="0.65"/>
                <line x1="${100 - ww/5}" y1="96" x2="${100 + ww/5}" y2="96" stroke="${skinShadow}" stroke-width="1.4" opacity="0.6"/>
                <line x1="${100 - ww/5}" y1="104" x2="${100 + ww/5}" y2="104" stroke="${skinShadow}" stroke-width="1.4" opacity="0.6"/>
            ` : '';

            return `
                <svg width="${size}" height="${size}" viewBox="0 0 200 200" class="pet-float overflow-visible">
                    ${auraSvg}
                    ${pet.gear === 'cape' ? gearSvg : ''}
                    <!-- Legs -->
                    <rect x="${100 - ww/2 + 1}" y="134" width="${lw}" height="46" rx="${lw/2}" fill="${skin}"/>
                    <rect x="${100 + ww/2 - lw - 1}" y="134" width="${lw}" height="46" rx="${lw/2}" fill="${skin}"/>
                    <!-- Sneakers -->
                    <rect x="${100 - ww/2 - 2}" y="174" width="${lw + 5}" height="10" rx="5" fill="${accent}"/>
                    <rect x="${100 + ww/2 - lw - 3}" y="174" width="${lw + 5}" height="10" rx="5" fill="${accent}"/>
                    <!-- Arms (Flexing / Athletic Stance) -->
                    <path d="M${100 - sw/2 + 2},72 Q${100 - sw/2 - 14},92 ${100 - sw/2 - 6},112" fill="none" stroke="${skin}" stroke-width="${aw}" stroke-linecap="round"/>
                    <path d="M${100 + sw/2 - 2},72 Q${100 + sw/2 + 14},92 ${100 + sw/2 + 6},112" fill="none" stroke="${skin}" stroke-width="${aw}" stroke-linecap="round"/>
                    <!-- Torso -->
                    <path d="${torsoPath}" fill="${skin}"/>
                    ${muscleSvg}
                    ${outfitSvg}
                    <!-- Neck & Head -->
                    <rect x="93" y="56" width="14" height="14" rx="5" fill="${skinShadow}"/>
                    <rect x="80" y="20" width="40" height="42" rx="20" fill="${skin}"/>
                    ${hairSvg}
                    <!-- Eyes & Confident Smile -->
                    <circle cx="91" cy="41" r="3.2" fill="#09090b"/>
                    <circle cx="109" cy="41" r="3.2" fill="#09090b"/>
                    <path d="M94,50 Q100,55 106,50" fill="none" stroke="#09090b" stroke-width="2.4" stroke-linecap="round"/>
                    ${glassesSvg}
                    ${hatSvg}
                    ${pet.gear !== 'cape' ? gearSvg : ''}
                </svg>
            `;
        }

        function renderBossSVG(boss, size = 110) {
            return `
                <svg width="${size}" height="${size}" viewBox="0 0 200 200" class="pet-float overflow-visible">
                    <circle cx="100" cy="105" r="76" fill="${boss.color}" opacity="0.14"/>
                    <!-- Horns -->
                    <polygon points="62,62 42,26 82,50" fill="${boss.color}"/>
                    <polygon points="138,62 158,26 118,50" fill="${boss.color}"/>
                    <!-- Heavy Body -->
                    <rect x="52" y="54" width="96" height="114" rx="34" fill="#18181b" stroke="${boss.color}" stroke-width="4"/>
                    <!-- Glowing Eyes -->

        let activeBattle = null;

            let bossCardsHtml = BATTLE_BOSSES.map(boss => {
                const isAboveTier = boss.tierIdx > fighter.stageIdx;

                                </div>
                                <p class="text-[11px] text-zinc-400 mt-0.5">HP ${boss.hp} • ATK ${boss.atk} • <span class="text-yellow-300 font-bold">+${boss.coins} 🪙</span></p>
                                ${isAboveTier ? `<span class="text-[9px] text-orange-400 font-bold">⚠️ High Challenge (Giant Killer Medal!)</span>` : ''}
                            </div>
                        </div>
                        <button onclick="startBattle('${boss.id}')" class="bg-brand-main text-brand-contrast px-4 py-2.5 rounded-full text-xs font-bold shadow-md active:scale-95 transition-transform flex-shrink-0">
                            Fight ⚔️
                        </button>
                    </div>
                `;
            }).join('');

            overlay.innerHTML = `
                <div class="flex-1 flex flex-col bg-zinc-950 h-full">
                    <div class="px-5 py-4 flex items-center justify-between glass-card sticky top-0 z-20 border-b border-zinc-800/50">
                        <button onclick="openPetStudio('hat')" class="text-zinc-300 hover:text-white px-3 py-1.5 bg-zinc-900 rounded-full text-xs font-bold flex items-center gap-1">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Studio
                        </button>
                        <span class="text-xs font-bold text-brand-main uppercase tracking-widest">⚔️ Streak Battle Arena</span>
                        <button onclick="closePetStudio()" class="text-zinc-400 hover:text-white p-2 bg-zinc-900 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6 pb-24">
                        <!-- Fighter Stats Banner -->
                        <div class="glass-card rounded-[2rem] p-5 mb-6 border border-brand-muted/40 flex items-center gap-4">
                            <div class="w-20 h-20 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center flex-shrink-0">
                                ${renderPetSVG(76)}
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between">
                                    <h3 class="font-bold text-white text-base">${pet.name}</h3>
                                    <span class="text-[10px] font-bold bg-brand-bg text-brand-main px-2.5 py-0.5 rounded-full capitalize">${store.data.gender} • ${fighter.stage}</span>
                                </div>
                                <p class="text-[11px] text-zinc-400 mt-0.5">${fighter.buildLabel}</p>
                                <div class="grid grid-cols-4 gap-1.5 mt-3 text-center">
                                    <div class="bg-zinc-900/90 rounded-xl p-1.5 border border-zinc-800"><span class="block text-[9px] text-zinc-500">HP</span><span class="text-xs font-bold text-green-400">${fighter.maxHp}</span></div>
                                    <div class="bg-zinc-900/90 rounded-xl p-1.5 border border-zinc-800"><span class="block text-[9px] text-zinc-500">ATK</span><span class="text-xs font-bold text-brand-main">${fighter.atk}</span></div>
                                    <div class="bg-zinc-900/90 rounded-xl p-1.5 border border-zinc-800"><span class="block text-[9px] text-zinc-500">DEF</span><span class="text-xs font-bold text-cyan-400">${fighter.def}</span></div>
                                    <div class="bg-zinc-900/90 rounded-xl p-1.5 border border-zinc-800"><span class="block text-[9px] text-zinc-500">CRIT</span><span class="text-xs font-bold text-orange-400">${fighter.critChance}%</span></div>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-3 px-1">
                            <h3 class="font-bold text-white text-sm">Choose Opponent</h3>

                        <div class="space-y-3">

                    </div>

            `;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            lucide.createIcons();
        }

        function startBattle(bossId) {
            const boss = BATTLE_BOSSES.find(b => b.id === bossId);
            const fighter = getFighterCombatStats();
            if (!boss) return;

            activeBattle = {
                boss: { ...boss, currentHp: boss.hp },
                player: { ...fighter, currentHp: fighter.maxHp, guarding: false, charge: 0 },
                log: `⚔️ ${store.data.pet.name} (${fighter.buildLabel}) enters the ring against ${boss.name}!`,
                over: false,
                won: false
            };
            renderBattleScreen();
        }

        function renderBattleScreen(shakeTarget = null) {
            const overlay = document.getElementById('pet-modal');
            const b = activeBattle.boss;
            const p = activeBattle.player;
            const pHpPct = Math.max(0, Math.round((p.currentHp / p.maxHp) * 100));
            const bHpPct = Math.max(0, Math.round((b.currentHp / b.hp) * 100));
            const finisherReady = p.charge >= 2;

            overlay.innerHTML = `
                <div class="flex-1 flex flex-col bg-zinc-950 h-full">
                    <div class="px-5 py-4 flex items-center justify-between glass-card sticky top-0 z-20 border-b border-zinc-800/50">
                        <span class="text-xs font-bold text-brand-main uppercase tracking-widest">⚔️ Live Arena Fight</span>
                        <button onclick="openBattleArena()" class="text-zinc-400 hover:text-white px-3 py-1.5 bg-zinc-900 rounded-full text-xs font-bold">Forfeit</button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-5 flex flex-col justify-between pb-10">
                        <!-- Boss Stage -->
                        <div class="glass-card rounded-[2rem] p-4 border border-zinc-800/80 ${shakeTarget === 'boss' ? 'hit-shake border-red-500/60' : ''}">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-white text-sm">${b.name} <span class="text-[10px] text-zinc-400">(${b.tierName})</span></span>
                                <span class="text-xs font-bold text-red-400">${Math.max(0, b.currentHp)} / ${b.hp} HP</span>
                            </div>
                            <div class="w-full bg-zinc-900 h-2.5 rounded-full overflow-hidden mb-3 border border-zinc-800">
                                <div class="bg-red-500 h-full rounded-full transition-all duration-300" style="width: ${bHpPct}%"></div>
                            </div>
                            <div class="flex justify-center py-1">
                                ${renderBossSVG(b, 92)}
                            </div>
                        </div>

                        <!-- Combat Log -->
                        <div class="my-3 bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3.5 text-center">
                            <p class="text-xs text-zinc-200 leading-relaxed font-medium">${activeBattle.log}</p>
                        </div>

                        <!-- Player Fighter Stage -->
                        <div class="glass-card rounded-[2rem] p-4 border border-brand-muted/50 ${shakeTarget === 'player' ? 'hit-shake border-orange-500/60' : ''}">
                            <div class="flex justify-center py-1">
                                ${renderPetSVG(96)}
                            </div>
                            <div class="flex justify-between items-center mt-2 mb-2">
                                <span class="font-bold text-white text-sm">${store.data.pet.name} <span class="text-[10px] text-brand-main">(${p.stage})</span></span>
                                <span class="text-xs font-bold text-green-400">${Math.max(0, p.currentHp)} / ${p.maxHp} HP</span>
                            </div>
                            <div class="w-full bg-zinc-900 h-2.5 rounded-full overflow-hidden border border-zinc-800">
                                <div class="bg-brand-main h-full rounded-full transition-all duration-300" style="width: ${pHpPct}%"></div>
                            </div>
                        </div>

                        <!-- Combat Moves or Victory/Defeat Footer -->
                        ${activeBattle.over ? `
                            <div class="mt-4 space-y-2.5">
                                <button onclick="openBattleArena()" class="w-full bg-brand-main text-brand-contrast rounded-full py-4 font-bold text-sm shadow-xl active:scale-95 transition-transform">
                                    ${activeBattle.won ? '🏆 Claim Victory & Return to Arena' : '🔄 Train & Try Again'}
                                </button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 gap-2.5 mt-4">
                                <button onclick="executeBattleMove('power')" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl p-3 text-left active:scale-95 transition-transform">
                                    <span class="block text-xs font-bold text-brand-main">💪 Power Rep</span>
                                    <span class="text-[10px] text-zinc-400">Heavy strike • +1 Charge</span>
                                </button>
                                <button onclick="executeBattleMove('cardio')" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl p-3 text-left active:scale-95 transition-transform">
                                    <span class="block text-xs font-bold text-cyan-400">⚡ Cardio Blitz</span>
                                    <span class="text-[10px] text-zinc-400">2x Combo • High Streak Crit</span>
                                </button>
                                <button onclick="executeBattleMove('guard')" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl p-3 text-left active:scale-95 transition-transform">
                                    <span class="block text-xs font-bold text-green-400">🛡️ Iron Core Guard</span>
                                    <span class="text-[10px] text-zinc-400">Block 65% DMG + Heal 15%</span>
                                </button>
                                <button onclick="executeBattleMove('finisher')" ${finisherReady ? '' : 'disabled'} class="rounded-2xl p-3 text-left transition-transform ${finisherReady ? 'bg-brand-main text-brand-contrast font-bold shadow-lg active:scale-95' : 'bg-zinc-900/40 border border-zinc-800/60 text-zinc-600'}">
                                    <span class="block text-xs font-bold">🔥 Streak Finisher</span>
                                    <span class="text-[10px] ${finisherReady ? 'text-brand-contrast/80' : 'text-zinc-600'}">${finisherReady ? 'READY! 2.2x Massive DMG' : `Charge (${p.charge}/2)`}</span>
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function executeBattleMove(moveType) {
            if (!activeBattle || activeBattle.over) return;
            const p = activeBattle.player;
            const b = activeBattle.boss;
            p.guarding = false;
            let actionMsg = '';

            const rollCrit = (bonus = 0) => (Math.random() * 100) < (p.critChance + bonus);

            if (moveType === 'power') {
                const crit = rollCrit(0);
                const raw = Math.max(8, p.atk - Math.floor(b.def * 0.5));
                const dmg = crit ? Math.round(raw * 1.5) : raw;
                b.currentHp -= dmg;
                p.charge = Math.min(2, p.charge + 1);
                actionMsg = `💪 Power Rep deals <b>${dmg} DMG</b>${crit ? ' (CRITICAL!)' : ''}!`;
            } else if (moveType === 'cardio') {
                const crit = rollCrit(15);
                const hit1 = Math.max(5, Math.round(p.atk * 0.6) - Math.floor(b.def * 0.3));
                const hit2 = crit ? Math.round(hit1 * 1.6) : hit1;
                const total = hit1 + hit2;
                b.currentHp -= total;
                p.charge = Math.min(2, p.charge + 1);
                actionMsg = `⚡ Cardio Blitz hits twice for <b>${total} DMG</b>${crit ? ' (STREAK CRIT!)' : ''}!`;
            } else if (moveType === 'guard') {
                p.guarding = true;
                const heal = Math.round(p.maxHp * 0.15);
                p.currentHp = Math.min(p.maxHp, p.currentHp + heal);
                p.charge = Math.min(2, p.charge + 1);
                actionMsg = `🛡️ Iron Core Guard! Recovered <b>+${heal} HP</b> and braced for impact!`;
            } else if (moveType === 'finisher' && p.charge >= 2) {
                p.charge = 0;
                const dmg = Math.max(15, Math.round(p.atk * 2.2) - Math.floor(b.def * 0.3));
                b.currentHp -= dmg;
                actionMsg = `🔥 STREAK FINISHER unleashes <b>${dmg} MASSIVE DMG</b>!`;
            }

            if (navigator.vibrate) navigator.vibrate(60);

            // Check Boss Defeated
            if (b.currentHp <= 0) {
                b.currentHp = 0;
                activeBattle.over = true;
                activeBattle.won = true;
                store.data.battlesWon = (store.data.battlesWon || 0) + 1;

                const today = store.getTodayStr();
                if (store.data.dailyBattleWins?.date !== today) {
                    store.data.dailyBattleWins = { date: today, count: 0 };
                }
                let coinReward = 0;
                if (store.data.dailyBattleWins.count < 3) {
                    coinReward = b.coins;
                    store.data.dailyBattleWins.count++;
                    store.data.coins = (store.data.coins || 0) + coinReward;
                }
                store.data.xp = (store.data.xp || 0) + b.xp;

                if (b.tierIdx > p.stageIdx) {
                    const unlocked = store.data.achievements.map(a => a.id);
                    if (!unlocked.includes('giant_killer')) {
                        store.data.achievements.push({ id: 'giant_killer', date: today });
                        store.data.coins += 200;
                    }
                }
                store.save();
                checkAchievements();

                activeBattle.log = `${actionMsg}<br>🏆 <b>${b.name} DEFEATED!</b> ${coinReward > 0 ? `+${coinReward} FitCoins & ` : ''}+${b.xp} XP earned!`;
                renderBattleScreen('boss');
                return;
            }

            // Boss Counterattack
            const rawBossDmg = Math.max(5, b.atk - Math.floor(p.def * 0.5));
            const bossDmg = p.guarding ? Math.max(2, Math.round(rawBossDmg * 0.35)) : rawBossDmg;
            p.currentHp -= bossDmg;

            if (p.currentHp <= 0) {
                p.currentHp = 0;
                activeBattle.over = true;
                activeBattle.won = false;
                activeBattle.log = `${actionMsg}<br>💥 ${b.name} strikes for ${bossDmg} DMG! Complete more workouts to boost your HP & Strength!`;
                renderBattleScreen('player');
                return;
            }

            activeBattle.log = `${actionMsg}<br>👹 ${b.name} counters for <b>${bossDmg} DMG</b>${p.guarding ? ' (Blocked!)' : ''}!`;
            renderBattleScreen('boss');
        }

            const todayDateStr = store.getTodayStr();

            let html = '<div class="flex justify-between items-center glass-card p-4 rounded-[2rem] mb-6">';
            
            orderedDays.forEach((dayNum, i) => {
                const dayDate = new Date(curr.setDate(first + i));
                const dateStr = dayDate.toISOString().split('T')[0];
                const plan = SCHEDULE.find(s => s.day === dayNum);
                
                const workoutDone = store.data.workouts.some(w => w.date.startsWith(dateStr));
                const checkInDone = store.data.checkIns.find(c => c.date.startsWith(dateStr));
                const isCompleted = workoutDone || (checkInDone && checkInDone.activity);
                
                let style = 'bg-zinc-800/80 text-zinc-500 border border-zinc-700/50'; 
                
                if (isCompleted) {
                    style = 'bg-brand-main text-brand-contrast shadow-md shadow-brand-main/20 border border-brand-main';
                } else if (dateStr < todayDateStr) {
                    style = 'bg-zinc-950/80 text-zinc-700 border border-zinc-800/50';
                } else if (dateStr === todayDateStr) {
                    style = 'bg-zinc-900 text-brand-main border-2 border-brand-main font-bold shadow-[0_0_10px_var(--brand-main)]';
                } else if (plan.type === 'rest') {

                            ${isCompleted ? '<i data-lucide="check" class="w-4 h-4"></i>' : labels[i]}

                const overlay = document.getElementById('workout-session');

        function renderActiveWorkout() {

        function completeSet(index) {
            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            if (index === exData.completedSets) {
                exData.completedSets++;
                renderActiveWorkout();
                
                const isLastEx = activeWorkout.exIndex === activeWorkout.exercises.length - 1;
                const isLastSet = exData.completedSets === exData.sets;
                if (!(isLastEx && isLastSet) && exData.id !== 'jogging') {
                    startRestTimer();
                }
            }
        }

        function checkAllSetsCompleted() {
            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            const btn = document.getElementById('next-ex-btn');
            if (exData.completedSets === exData.sets) {
                btn.disabled = false;
                btn.className = "w-full bg-brand-main text-brand-contrast rounded-full py-4 font-bold shadow-xl shadow-brand-main/30 active:scale-95 transition-transform tracking-wide text-sm flex items-center justify-center gap-2 border border-white/20";
            }
        }

        function startRestTimer() {
            const timerEl = document.getElementById('rest-timer');
            const displayEl = document.getElementById('timer-display');
            timerEl.classList.remove('hidden');
            timerEl.classList.add('flex');
            
            let time = 45;
            if (store.data.difficulty === 'starter' || store.data.difficulty === 'easy') time = 60;
            else if (store.data.difficulty === 'steady') time = 45;
            else if (store.data.difficulty === 'hard') time = 30;
            else if (store.data.difficulty === 'elite') time = 20;

            displayEl.innerText = time;
            
            restInterval = setInterval(() => {
                time--;
                displayEl.innerText = time;
                if (time <= 0) {
                    skipRest();
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(restInterval);
            const timerEl = document.getElementById('rest-timer');
            timerEl.classList.add('hidden');
            timerEl.classList.remove('flex');
        }

        function nextExercise() {
            if (activeWorkout.exIndex < activeWorkout.exercises.length - 1) {
                activeWorkout.exIndex++;
                renderActiveWorkout();
            } else {
                finishWorkout();
            }
        }

        function finishWorkout() {
            if(!store.hasCompletedWorkoutToday()) {
                store.data.workouts.push({
                    date: store.getTodayStr(),
                    type: activeWorkout.plan.type,
                    title: activeWorkout.plan.title,
                    difficulty: store.data.difficulty,
                    kudos: 1,
                    exercises: activeWorkout.exercises.map(ex => ({
                        name: ex.name,
                        sets: ex.completedSets,
                        reps: ex.reps
                    }))
                });
                store.data.coins = (store.data.coins || 0) + 50;
                store.data.xp = (store.data.xp || 0) + 100;
                store.save();
                checkAchievements();
            }
            
            closeWorkoutSession();
            showCompletionScreen();
        }

        function saveCheckIn(dateStr) {
            const index = store.data.checkIns.findIndex(c => c.date.startsWith(dateStr));
            const newRecord = {
                date: dateStr,
                activity: document.getElementById('chk-activity').checked,
                water: document.getElementById('chk-water').checked,
                sleep: document.getElementById('chk-sleep').checked,
                energy: document.getElementById('chk-energy').checked,
                notes: document.getElementById('chk-notes').value.trim()
            };

            if (index !== -1) {
                store.data.checkIns[index] = newRecord; 
            } else {
                store.data.checkIns.push(newRecord);
                store.data.coins = (store.data.coins || 0) + 15;
                store.data.xp = (store.data.xp || 0) + 30;
            }
            
            store.save();
            checkAchievements();
            closeWorkoutSession();
            showNotification(index !== -1 ? "Reflection updated!" : "Reflection saved! +15 FitCoins 🪙");
            if(router.current === 'progress') { renderProgress(document.getElementById('view-progress')); }
            else { router.navigate('home'); }
        }

        // --- 8. UTILITIES (Export/Import/ICS) ---
        function exportData() {
            try {
                const dataStr = JSON.stringify(store.data, null, 2);
                
                // For modern mobile browsers / iOS Safari
                if (navigator.canShare) {
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const file = new File([blob], "fits_backup.json", { type: 'application/json' });
                    
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({
                            title: 'Fits Backup',
                            text: 'Here is my Fits app progress backup.',
                            files: [file]
                        }).then(() => {
                            showNotification("Backup saved successfully!");
                        }).catch((error) => {
                            console.log("Share cancelled", error);
                        });
                        return;
                    }
                }

                // Fallback copy via textarea for maximum iOS compatibility
                const textArea = document.createElement("textarea");
                textArea.value = dataStr;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showInfoModal("Backup Copied!", "Your backup data has been copied to your clipboard.\n\nOpen your Apple Notes app and paste it there to keep your progress safe.");

            } catch(e) {
                showInfoModal("Export Error", "Export failed: " + e.message);
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.workouts) && Array.isArray(imported.checkIns)) {
                        showConfirmModal("Import Backup?", "Importing will overwrite your current progress with the backup file. Continue?", () => {
                            store.data = imported;
                            store.save();
                            store.load();
                            checkAchievements(); 
                            showNotification("Data imported successfully!");
                            router.navigate('home');
                        }, "Import");
                    } else {
                        showInfoModal("Invalid File", "Invalid backup file format. Your current progress was not changed.");
                    }
                } catch (err) {
                    showInfoModal("Read Error", "Error reading file. Make sure it's a valid JSON backup.");
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function resetData() {
            showConfirmModal(
                "Reset All Progress?",
                "Are you absolutely sure you want to delete ALL workouts, streaks, coins, and pet items? This cannot be undone.",
                () => {
                    localStorage.removeItem('mfj_data');
                    store.load();
                    router.navigate('home');
                    showNotification("All data has been reset.");
                },
                "Delete Everything",
                true
            );
        }

        function downloadICS() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dtStart = `${yyyy}${mm}${dd}T070000`; 

            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Fits//EN
BEGIN:VEVENT
SUMMARY:Morning Fitness Reflection
DESCRIPTION:Time to show up for yourself. Let's build strength one day at a time.
RRULE:FREQ=DAILY
DTSTART:${dtStart}
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:Morning Fitness Reflection Reminder
TRIGGER:-PT0M
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fits-reminder.ics';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setTimeout(() => {
                showInfoModal(
                    "iPhone Calendar Setup",
                    "1. Safari will prompt you to download the file.\n2. Tap 'Download'.\n3. Tap the Downloads icon (↓) in the Safari address bar, open the file, and tap 'Add All' to save the recurring 7:00 AM alarm."
                );
            }, 600);
        }

    </script>
