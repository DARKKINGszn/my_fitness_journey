    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            main: 'var(--brand-main)',
                            bg: 'var(--brand-bg)',
                            contrast: 'var(--brand-contrast)',
                            muted: 'var(--brand-muted)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* THEME VARIABLES */
        :root, .theme-lemon {
            --brand-main: #e0ff33;
            --brand-bg: #222a00;
            --brand-contrast: #000000;
            --brand-muted: #5e7300;
        }
        .theme-purple {
            --brand-main: #a78bfa;
            --brand-bg: #2e1a47;
            --brand-contrast: #000000;
            --brand-muted: #6d28d9;
        }
        .theme-cyan {
            --brand-main: #22d3ee;
            --brand-bg: #083344;
            --brand-contrast: #000000;
            --brand-muted: #0e7490;
        }
        .theme-rose {
            --brand-main: #fb7185;
            --brand-bg: #4c0519;
            --brand-contrast: #000000;
            --brand-muted: #be123c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up-modal { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Custom Rounded Checkbox */
        .custom-checkbox input:checked + div {
            background-color: var(--brand-main);
            border-color: var(--brand-main);
        }
        .custom-checkbox input:checked + div svg { 
            display: block; 
            color: var(--brand-contrast);
        }
        
        /* Activity Heatmap Graph */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            border-radius: 9999px;
        }

        /* Safe area spacing for iOS status bar */
        .ios-safe-top {
            padding-top: calc(env(safe-area-inset-top) + 1.75rem);
        }
        .ios-safe-modal {
            padding-top: calc(env(safe-area-inset-top) + 0.75rem);
        }
        
        /* Clean Native Surface Style */
        .glass-card {
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* Floating Pill Liquid Glass Navigation Bar */
        .liquid-glass-nav {
            background: linear-gradient(180deg, rgba(44, 44, 48, 0.56) 0%, rgba(16, 16, 19, 0.74) 100%);
            backdrop-filter: blur(26px) saturate(190%);
            -webkit-backdrop-filter: blur(26px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
                0 20px 42px -10px rgba(0, 0, 0, 0.88);
        }

        /* Fighter Floating & Battle Animations */
        @keyframes floatPet {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .pet-float {
            animation: floatPet 3s ease-in-out infinite;
        }
        @keyframes popScale {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-2deg); }
            40% { transform: translateX(8px) rotate(2deg); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .hit-shake {
            animation: hitShake 0.35s ease-in-out;
        }
    </style>
</head>

            getDateStr(dateObj = new Date()) {
                const yyyy = dateObj.getFullYear();
                const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dd = String(dateObj.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;

                return this.data.checkIns.find(c => c.date && c.date.startsWith(today)) || null;

        // --- 3. STREAK & PROGRESSION CALCULATORS ---
        function getAllActiveDatesSet() {
            const set = new Set();
            store.data.workouts.forEach(w => {
                if (w.date) set.add(w.date.slice(0, 10));
            });
            store.data.checkIns.forEach(c => {
                if (c.date && c.activity) set.add(c.date.slice(0, 10));
            });
            (store.data.streakBridges || []).forEach(d => set.add(d));
            return set;
        }

        function getStreakInfo() {
            const activeSet = getAllActiveDatesSet();
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = store.getDateStr(today);

            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = store.getDateStr(yesterday);

            let streak = 0;
            let cursor = new Date(today);
            if (!activeSet.has(todayStr)) {
                if (activeSet.has(yesterdayStr)) {
                    cursor = new Date(yesterday);
                } else {
                    const sortedDates = Array.from(activeSet).sort();
                    if (sortedDates.length > 0 && store.data.streakRestores > 0) {
                        const lastActiveStr = sortedDates[sortedDates.length - 1];
                        const [ly, lm, ld] = lastActiveStr.split('-').map(Number);
                        const lastDate = new Date(ly, lm - 1, ld);
                        const missedDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24)) - 1;

                        let priorStreak = 0;
                        let pCursor = new Date(lastDate);
                        while (activeSet.has(store.getDateStr(pCursor))) {
                            priorStreak++;
                            pCursor.setDate(pCursor.getDate() - 1);
                        }

                        if (missedDays >= 1 && priorStreak > 0) {
                            return {
                                current: 0,
                                canRestore: true,
                                missedDays,
                                priorStreak,
                                lastActiveStr
                            };
                        }
                    }
                    return { current: 0, canRestore: false, missedDays: 0, priorStreak: 0 };
                }
            }

            while (activeSet.has(store.getDateStr(cursor))) {
                streak++;
                cursor.setDate(cursor.getDate() - 1);
            }

            return { current: streak, canRestore: false, missedDays: 0, priorStreak: 0 };
        }

        function useStreakRestore() {
            const info = getStreakInfo();
            if (!info.canRestore || store.data.streakRestores <= 0) return;

            showConfirmModal(
                "Use Streak Restore?",
                `Bridge ${info.missedDays} missed day(s) to recover your ${info.priorStreak}-day streak? You will have ${store.data.streakRestores - 1} restore(s) remaining.`,
                () => {
                    const [ly, lm, ld] = info.lastActiveStr.split('-').map(Number);
                    const cursor = new Date(ly, lm - 1, ld + 1);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    while (cursor < today) {
                        const dStr = store.getDateStr(cursor);
                        if (!store.data.streakBridges.includes(dStr)) {
                            store.data.streakBridges.push(dStr);
                        }
                        cursor.setDate(cursor.getDate() + 1);
                    }

                    store.data.streakRestores -= 1;
                    store.save();
                    checkAchievements();
                    renderView(router.current);
                    showNotification(`Phoenix Restore activated! ${info.priorStreak}-day streak recovered.`);
                },
                "Restore Streak"
            );
        }

        function getFighterStats() {
            const stageIdx = Math.max(0, STAGES.findIndex(s => s.id === store.data.difficulty));
            const totalWorkouts = store.data.workouts.length;
            const streak = getStreakInfo().current;
            const pet = store.data.pet;

            let gearBonusAtk = 0;
            let gearBonusDef = 0;
            let gearBonusHp = 0;
            if (pet.hat !== 'none') gearBonusHp += 20;
            if (pet.glasses !== 'none') gearBonusAtk += 4;
            if (pet.gear !== 'none') gearBonusAtk += 6;
            if (pet.aura !== 'none') gearBonusDef += 5;

            const maxHp = 100 + (stageIdx * 45) + (totalWorkouts * 3) + gearBonusHp;
            const atk = 16 + (stageIdx * 8) + Math.floor(totalWorkouts * 0.8) + gearBonusAtk;
            const def = 4 + (stageIdx * 4) + Math.floor(streak * 0.5) + gearBonusDef;
            const crit = Math.min(45, 10 + (stageIdx * 5) + streak);

            return { stageIdx, maxHp, atk, def, crit, streak };
        }

        // --- 5. ROUTER & INITIALIZATION ---

        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 200;
                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    store.data.profilePic = canvas.toDataURL('image/jpeg', 0.72);
                    store.save();
                    renderView(router.current);
                    showNotification("Profile picture updated.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 7. ANTI-PROCRASTINATION: 5-4-3-2-1 LAUNCH & 2-MIN SPARK ---
        let fiveSecInterval = null;
        function startFiveSecondLaunch() {

            const renderCountdown = () => {

                        <h3 class="text-2xl font-bold text-white mb-2">Don't think. Just move.</h3>
                        <p class="text-sm text-zinc-400 mb-8 max-w-xs">Launching ${todayPlan.exercises ? todayPlan.title : 'your 2-Minute Momentum Spark'} automatically...</p>
                        <button onclick="cancelFiveSecondLaunch()" class="px-6 py-3 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold">Cancel</button>
                    </div>
                `;
            };
            renderCountdown();
            clearInterval(fiveSecInterval);
            fiveSecInterval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(fiveSecInterval);
                    if (todayPlan && todayPlan.exercises) {
                        startWorkoutSession(todayPlan.day);
                    } else {
                        startMicroWorkout();
                    }
                } else {
                    renderCountdown();
                }
            }, 1000);

        function startMicroWorkout() {
            const overlay = document.getElementById('workout-session');

                { name: "Marching in Place", desc: "Lift knees comfortably and swing your arms." },

                { name: "Bodyweight Squats", desc: "Smooth, steady pace—focus on breathing." },
                { name: "Deep Recovery Breathing", desc: "Inhale 4 seconds, exhale 4 seconds. Momentum built!" }
            ];
            let secondsLeft = 120;

            const renderMicro = () => {
                const stepIdx = Math.min(3, Math.floor((120 - secondsLeft) / 30));
                const mins = Math.floor(secondsLeft / 60);
                const secs = String(secondsLeft % 60).padStart(2, '0');
                overlay.innerHTML = `
                    <div class="flex justify-between items-center p-5 border-b border-zinc-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-brand-main">2-Min Anti-Procrastination Spark</span>

                    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">

        // --- 8. ACHIEVEMENTS ENGINE ---
        function getBestStreak() {
            const dates = Array.from(getAllActiveDatesSet()).sort();
            if (dates.length === 0) return 0;
            let best = 1;
            let run = 1;
            for (let i = 1; i < dates.length; i++) {
                const [y1, m1, d1] = dates[i - 1].split('-').map(Number);
                const [y2, m2, d2] = dates[i].split('-').map(Number);
                const prev = new Date(y1, m1 - 1, d1);
                const curr = new Date(y2, m2 - 1, d2);
                const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) {
                    run++;
                    if (run > best) best = run;
                } else if (diffDays > 1) {
                    run = 1;
                }
            }
            return Math.max(best, getStreakInfo().current);
        }

        function getMedalProgress(medal) {
            const workouts = store.data.workouts;
            const checkIns = store.data.checkIns;
            const activeDays = getAllActiveDatesSet().size;

            if (medal.stat === 'workouts') return workouts.length;
            if (medal.stat === 'best_streak') return getBestStreak();
            if (medal.stat === 'total_sets') {
                return workouts.reduce((sum, w) => sum + (w.exercises || []).reduce((s, e) => s + (e.sets || 1), 0), 0);
            }
            if (medal.stat === 'total_kudos') {
                return workouts.reduce((sum, w) => sum + (w.kudos || 1), 0);
            }
            if (medal.stat === 'total_km') {
                let km = 0;
                workouts.forEach(w => {
                    (w.exercises || []).forEach(e => {
                        if (e.name && e.name.toLowerCase().includes('jogging') && e.reps) {
                            const match = String(e.reps).match(/([\d.]+)\s*km/i);
                            if (match) km += parseFloat(match[1]);
                        }
                    });
                });
                return Math.floor(km);
            }
            if (medal.stat === 'checkins') return new Set(checkIns.map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'active_days') return activeDays;
            if (medal.stat === 'cardio') return workouts.filter(w => w.type === 'cardio').length;
            if (medal.stat === 'water') return new Set(checkIns.filter(c => c.water).map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'sleep') return new Set(checkIns.filter(c => c.sleep).map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'energy') return new Set(checkIns.filter(c => c.energy).map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'notes') return checkIns.filter(c => c.notes && c.notes.trim().length > 0).length;
            if (medal.stat === 'restores_used') return Math.max(0, 3 - (store.data.streakRestores ?? 3));
            if (medal.stat === 'micro') return store.data.microWorkouts || 0;
            if (medal.stat === 'battles') return store.data.battlesWon || 0;
            if (medal.stat === 'giant') return store.data.giantKilled ? 1 : 0;
            if (medal.stat === 'stage_idx') return Math.max(0, STAGES.findIndex(s => s.id === store.data.difficulty));
            if (medal.stat === 'coins') return store.data.coins || 0;
            if (medal.stat === 'unlocked_items') {
                return (store.data.pet.unlocked || []).filter(k => !k.endsWith(':none') && k !== 'species:dragon').length;
            }

            if (medal.stat === 'weekly_strength') {
                const weekCounts = {};
                workouts.filter(w => w.type === 'strength').forEach(w => {
                    const d = new Date(w.date);
                    const day = d.getDay();
                    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(d.getFullYear(), d.getMonth(), diff);
                    const key = store.getDateStr(monday);
                    weekCounts[key] = (weekCounts[key] || 0) + 1;
                });
                return Math.max(0, ...Object.values(weekCounts));
            }

            if (medal.stat === 'early') {
                const hasEarlyW = workouts.some(w => new Date(w.date).getHours() < 9);
                const hasEarlyC = checkIns.some(c => c.timestamp && new Date(c.timestamp).getHours() < 9);
                return (hasEarlyW || hasEarlyC) ? 1 : 0;
            }

            if (medal.stat === 'night') {
                const hasNightW = workouts.some(w => new Date(w.date).getHours() >= 20);
                const hasNightC = checkIns.some(c => c.timestamp && new Date(c.timestamp).getHours() >= 20);
                return (hasNightW || hasNightC) ? 1 : 0;
            }

            if (medal.stat === 'weekend') {
                const days = new Set([...workouts.map(w => new Date(w.date).getDay()), ...checkIns.filter(c => c.activity).map(c => new Date(c.date).getDay())]);
                return (days.has(6) ? 1 : 0) + (days.has(0) ? 1 : 0);
            }

            if (medal.stat === 'cosmetic') {
                const p = store.data.pet;
                return (p.hat !== 'none' || p.glasses !== 'none' || p.gear !== 'none' || p.aura !== 'none') ? 1 : 0;
            }

            if (medal.stat === 'perfect') {
                const workoutDates = new Set(workouts.map(w => w.date.slice(0, 10)));
                const hasPerfect = checkIns.some(c =>
                    c.activity && c.water && c.sleep && c.energy && workoutDates.has(c.date.slice(0, 10))
                );
                return hasPerfect ? 1 : 0;
            }

            return 0;
        }

        function checkAchievements() {
            if (!Array.isArray(store.data.achievements)) store.data.achievements = [];
            const newlyUnlocked = [];

            MEDALS.forEach(medal => {
                const alreadyUnlocked = store.data.achievements.some(a => a.id === medal.id);
                if (!alreadyUnlocked && getMedalProgress(medal) >= medal.target) {
                    store.data.achievements.push({
                        id: medal.id,
                        unlockedAt: new Date().toISOString()
                    });
                    store.data.coins = (store.data.coins || 0) + (medal.reward || 0);
                    newlyUnlocked.push(medal);
                }
            });

            if (newlyUnlocked.length > 0) {
                store.save();
                const latest = newlyUnlocked[newlyUnlocked.length - 1];
                const totalReward = newlyUnlocked.reduce((sum, m) => sum + (m.reward || 0), 0);
                const msg = newlyUnlocked.length === 1
                    ? `Medal Unlocked: ${latest.title} (+${totalReward} Coins)`
                    : `${newlyUnlocked.length} Medals Unlocked (+${totalReward} Coins)`;
                setTimeout(() => showNotification(msg), 350);
            }
        }

                playerHp: stats.maxHp,

        function executeBattleTurn(action) {
            if (!activeBattle || activeBattle.over) return;
            const b = activeBattle;
            let turnMsg = '';

            if (action === 'strike') {
                const isCrit = Math.random() * 100 < b.stats.crit;
                const baseDmg = Math.max(6, b.stats.atk - Math.floor(b.boss.def * 0.4));
                const dmg = isCrit ? Math.round(baseDmg * 1.65) : baseDmg;
                b.bossHp = Math.max(0, b.bossHp - dmg);
                turnMsg = isCrit ? `CRITICAL STRIKE — You dealt ${dmg} damage.` : `Clean Strike — You dealt ${dmg} damage.`;
            } else if (action === 'power') {
                if (Math.random() < 0.78) {
                    const dmg = Math.max(10, Math.round(b.stats.atk * 1.45) - Math.floor(b.boss.def * 0.3));
                    b.bossHp = Math.max(0, b.bossHp - dmg);
                    turnMsg = `POWER REP — Heavy hit for ${dmg} damage.`;
                } else {
                    turnMsg = `Your Power Rep missed.`;
                }
            } else if (action === 'heal' && b.healsLeft > 0) {
                const healAmt = Math.round(b.playerMaxHp * 0.32);
                b.playerHp = Math.min(b.playerMaxHp, b.playerHp + healAmt);
                b.healsLeft--;
                turnMsg = `Second Wind — Recovered +${healAmt} HP.`;
            }

            if (b.bossHp <= 0) {
                b.over = true;
                b.won = true;
                store.data.battlesWon = (store.data.battlesWon || 0) + 1;
                store.data.coins = (store.data.coins || 0) + b.boss.reward;
                store.data.xp = (store.data.xp || 0) + 50;
                if (b.boss.tierIdx > b.stats.stageIdx) {
                    store.data.giantKilled = true;
                }
                store.save();
                checkAchievements();
                b.log = `${turnMsg} Victory! Earned +${b.boss.reward} FitCoins.`;
                renderBattleScreen(true);
                return;
            }

            const bossDmg = Math.max(4, b.boss.atk - Math.floor(b.stats.def * 0.55) + Math.floor(Math.random() * 5 - 2));
            b.playerHp = Math.max(0, b.playerHp - bossDmg);

            if (b.playerHp <= 0) {
                b.over = true;
                b.won = false;
                b.log = `${turnMsg} ${b.boss.name} hits for ${bossDmg}. You were knocked out—train and try again.`;
            } else {
                b.log = `${turnMsg} ${b.boss.name} strikes back for ${bossDmg} dmg.`;
            }
            renderBattleScreen(true);
        }

        // --- 11. WORKOUT SESSION & WARM-UP ENGINE ---
        let currentSession = null;
        let restTimerInterval = null;

        function startWorkoutSession(dayNum) {
            const plan = SCHEDULE.find(s => s.day === dayNum);
            if (!plan || !plan.exercises) return;

            const diff = store.data.difficulty || 'steady';
            const stageObj = STAGES.find(s => s.id === diff) || STAGES[2];

            const exercises = plan.exercises.map(exKey => {
                const ex = EXERCISE_DB[exKey];
                const lvl = ex.levels[diff] || ex.levels.steady;
                return {
                    key: exKey,
                    name: ex.name,
                    target: ex.target,
                    desc: ex.desc,
                    alt: ex.alt,
                    sets: lvl.sets,
                    repsLabel: lvl.label,
                    completedSets: 0
                };
            });

            currentSession = {
                dayNum,
                title: plan.title,
                type: plan.type,
                difficulty: diff,
                restSec: stageObj.restSec,
                warmupDone: false,
                exIndex: 0,
                exercises,
                resting: false,
                restRemaining: 0
            };

            const overlay = document.getElementById('workout-session');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            renderWorkoutSession();
        }

        function completeWarmup() {
            if (!currentSession) return;
            currentSession.warmupDone = true;
            renderWorkoutSession();
        }

        function completeSet() {
            if (!currentSession) return;
            const ex = currentSession.exercises[currentSession.exIndex];
            ex.completedSets++;

            if (ex.completedSets >= ex.sets) {
                if (currentSession.exIndex < currentSession.exercises.length - 1) {
                    currentSession.exIndex++;
                    startRestTimer(currentSession.restSec);
                } else {
                    finishWorkout();
                }
            } else {
                startRestTimer(currentSession.restSec);
            }
        }

        function startRestTimer(seconds) {
            currentSession.resting = true;
            currentSession.restRemaining = seconds;
            renderWorkoutSession();

            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                if (!currentSession) {
                    clearInterval(restTimerInterval);
                    return;
                }
                currentSession.restRemaining--;
                if (currentSession.restRemaining <= 0) {
                    skipRest();
                } else {
                    const timerEl = document.getElementById('rest-timer-display');
                    if (timerEl) timerEl.textContent = `${currentSession.restRemaining}s`;
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(restTimerInterval);
            if (!currentSession) return;
            currentSession.resting = false;
            renderWorkoutSession();
        }

        function adjustRest(delta) {
            if (!currentSession || !currentSession.resting) return;
            currentSession.restRemaining = Math.max(5, currentSession.restRemaining + delta);
            const timerEl = document.getElementById('rest-timer-display');
            if (timerEl) timerEl.textContent = `${currentSession.restRemaining}s`;
        }

            overlay.classList.add('hidden');
            overlay.classList.remove('flex');

            overlay.innerHTML = `

                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div class="glass-card rounded-[1.5rem] p-4 text-center">
                            <p class="text-[11px] text-zinc-400 uppercase font-bold">Current Set</p>
                            <p class="text-2xl font-extrabold text-white mt-1">${ex.completedSets + 1} <span class="text-sm text-zinc-500">/ ${ex.sets}</span></p>
                        </div>
                        <div class="glass-card rounded-[1.5rem] p-4 text-center">

        function finishWorkout() {
            clearInterval(restTimerInterval);
            if (!currentSession) return;

            const todayStr = store.getTodayStr();
            const totalSets = currentSession.exercises.reduce((sum, e) => sum + e.sets, 0);

            const alreadyLoggedToday = store.data.workouts.some(
                w => w.date && w.date.startsWith(todayStr) && w.title === currentSession.title
            );

            if (!alreadyLoggedToday) {
                store.data.workouts.push({
                    date: new Date().toISOString(),
                    title: currentSession.title,
                    type: currentSession.type,
                    difficulty: currentSession.difficulty,
                    exercises: currentSession.exercises.map(e => ({
                        name: e.name,
                        sets: e.sets,
                        reps: e.repsLabel
                    })),
                    kudos: 1
                });

                const ciIdx = store.data.checkIns.findIndex(c => c.date && c.date.startsWith(todayStr));
                if (ciIdx !== -1) {
                    store.data.checkIns[ciIdx].activity = true;
                }

                store.data.coins = (store.data.coins || 0) + 50;
                store.data.xp = (store.data.xp || 0) + 100;
                store.save();
                checkAchievements();
            }

            const summary = {
                title: currentSession.title,
                exercisesCount: currentSession.exercises.length,
                totalSets,
                difficulty: currentSession.difficulty
            };

            closeWorkoutSession();
            showCompletionScreen(summary);
        }

        // --- 12. DAILY REFLECTION CHECK-IN & AI COACH RESPONSE ---
        function generateCoachFeedback(entry) {
            const score = (entry.activity ? 1 : 0) + (entry.water ? 1 : 0) + (entry.sleep ? 1 : 0) + (entry.energy ? 1 : 0);
            const noteLower = (entry.notes || '').toLowerCase();

            let noteInsight = '';
            if (noteLower.includes('tired') || noteLower.includes('sore') || noteLower.includes('exhausted') || noteLower.includes('hard')) {
                noteInsight = "You mentioned feeling fatigued or challenged—prioritize extra water and quality sleep tonight so your muscles rebuild stronger.";
            } else if (noteLower.includes('great') || noteLower.includes('strong') || noteLower.includes('easy') || noteLower.includes('good')) {
                noteInsight = "Your energy and form sound locked in! Keep stacking days like this to unlock the next intensity stage.";
            } else if (entry.notes && entry.notes.trim().length > 0) {
                noteInsight = "Logging your thoughts builds real self-awareness—keep tracking what feels smooth and what needs focus.";
            }

            if (score === 4) {
                return `Elite Discipline — You hit all 4 daily pillars today. ${noteInsight || 'Your recovery and consistency are firing on all cylinders.'}`;
            } else if (score === 3) {
                return `Strong Showing — 3 out of 4 pillars locked in. ${noteInsight || 'Focus on the one unchecked habit tomorrow to make it a clean sweep.'}`;
            } else if (score >= 1) {
                return `Solid Check-In — Showing up and tracking honestly keeps your momentum alive. ${noteInsight || 'Small daily wins compound into major strength gains.'}`;
            }
            return `Honest Check-In Logged — Even on low-energy days, awareness is step one. Try a 2-Minute Spark or gentle stretch tomorrow.`;
        }

            let html = '<div class="flex justify-between items-center py-2 px-1 mb-5">';

            orderedDays.forEach((dayNum, i) => {

                const plan = SCHEDULE.find(s => s.day === dayNum);

                const workoutDone = store.data.workouts.some(w => w.date && w.date.startsWith(dateStr));
                const checkInDone = store.data.checkIns.find(c => c.date && c.date.startsWith(dateStr));
                const isCompleted = workoutDone || (checkInDone && checkInDone.activity) || (store.data.streakBridges || []).includes(dateStr);

                let style = 'bg-zinc-900 text-zinc-500 border border-zinc-800';
                if (isCompleted) {
                    style = 'bg-brand-main text-brand-contrast font-bold';
                } else if (dateStr < todayDateStr) {

                } else if (dateStr === todayDateStr) {

                        <button onclick="setAchievementFilter('${t.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${achievementFilter === t.id ? 'bg-brand-main text-brand-contrast' : 'bg-zinc-900 text-zinc-400'}">
                            ${t.label}
                        </button>
                    `).join('')}
                </div>

                <div class="space-y-2.5">
                    ${visibleMedals.map(medal => {
                        const unlockedRecord = store.data.achievements.find(a => a.id === medal.id);
                        const isUnlocked = Boolean(unlockedRecord);
                        const currentVal = Math.min(medal.target, getMedalProgress(medal));
                        const pct = Math.round((currentVal / medal.target) * 100);

                        return `
                            <div class="glass-card rounded-2xl p-3.5 flex items-center gap-3.5 ${isUnlocked ? 'border border-brand-main/40' : 'opacity-65'}">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${isUnlocked ? 'bg-brand-main text-brand-contrast' : 'bg-zinc-900 text-zinc-500'}">
                                    <i data-lucide="${isUnlocked ? medal.icon : 'lock'}" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-center gap-2">
                                        <h4 class="text-sm font-bold text-white truncate">${medal.title}</h4>
                                        <span class="text-[11px] font-bold text-brand-main shrink-0">+${medal.reward}</span>
                                    </div>
                                    <p class="text-xs text-zinc-400 truncate mb-1.5">${medal.desc}</p>
                                    ${!isUnlocked ? `
                                        <div class="flex items-center gap-2">
                                            <div class="flex-1 h-1 bg-zinc-900 rounded-full overflow-hidden">
                                                <div class="h-full bg-brand-main" style="width: ${pct}%"></div>
                                            </div>
                                            <span class="text-[10px] font-bold text-zinc-500">${currentVal}/${medal.target}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderSettings(container) {
            const userName = store.data.userName || 'King';
            const currentTheme = store.data.theme || 'lemon';
            const currentDiff = store.data.difficulty || 'steady';

            const avatarPreview = store.data.profilePic
                ? `<img src="${store.data.profilePic}" alt="Profile" class="w-14 h-14 rounded-full object-cover border border-zinc-700">`
                : `<div class="w-14 h-14 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-brand-main font-extrabold text-lg">${userName.charAt(0).toUpperCase()}</div>`;

            container.innerHTML = `
                <h1 class="text-2xl font-extrabold text-white tracking-tight mb-4">Settings</h1>

                <!-- Grouped Profile & Fighter -->
                <div class="glass-card rounded-3xl p-4 mb-4 divide-y divide-zinc-800/80">
                    <div class="flex items-center gap-3.5 pb-3.5">
                        ${avatarPreview}
                        <div class="flex-1">
                            <h3 class="text-base font-bold text-white">${userName}</h3>
                            <div class="flex gap-2 mt-1">
                                <button onclick="updateUserNameFromSettings()" class="px-3 py-1 rounded-full bg-zinc-900 text-xs font-semibold text-zinc-200">Name</button>
                                <label class="px-3 py-1 rounded-full bg-zinc-900 text-xs font-semibold text-brand-main cursor-pointer">
                                    Photo
                                    <input type="file" accept="image/*" class="hidden" onchange="handleProfilePicUpload(event)">
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="py-3 flex items-center justify-between">
                        <span class="text-xs font-semibold text-zinc-300">Fighter Build</span>
                        <div class="flex bg-zinc-900 p-0.5 rounded-full">
                            <button onclick="setUserGender('male')" class="px-3 py-1 rounded-full text-xs font-bold ${store.data.gender === 'male' ? 'bg-brand-main text-brand-contrast' : 'text-zinc-400'}">Male</button>
                            <button onclick="setUserGender('female')" class="px-3 py-1 rounded-full text-xs font-bold ${store.data.gender === 'female' ? 'bg-brand-main text-brand-contrast' : 'text-zinc-400'}">Female</button>
                        </div>
                    </div>

                    <div class="py-3 flex items-center justify-between">
                        <span class="text-xs font-semibold text-zinc-300">Skin Tone</span>
                        <div class="flex items-center gap-2">
                            ${SKIN_TONES.map(st => `
                                <button onclick="setUserSkinTone('${st.id}')" title="${st.label}" class="w-5 h-5 rounded-full border-2 ${store.data.skinTone === st.id ? 'border-brand-main scale-110' : 'border-transparent'}" style="background:${st.base}"></button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="pt-3 flex items-center justify-between">
                        <span class="text-xs font-semibold text-zinc-300">Accent</span>
                        <div class="flex items-center gap-2">
                            ${[
                                { id: 'lemon', dot: '#e0ff33' },
                                { id: 'purple', dot: '#a78bfa' },
                                { id: 'cyan', dot: '#22d3ee' },
                                { id: 'rose', dot: '#fb7185' }
                            ].map(t => `
                                <button onclick="setTheme('${t.id}')" class="w-6 h-6 rounded-full border-2 ${currentTheme === t.id ? 'border-white scale-110' : 'border-transparent'}" style="background:${t.dot}"></button>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- Intensity Stage -->
                <div class="glass-card rounded-3xl p-4 mb-4">
                    <div class="flex justify-between items-center mb-2.5">
                        <span class="text-xs font-bold text-zinc-300">Intensity Stage</span>
                        <span class="text-[11px] text-zinc-500">Past logs stay safe</span>
                    </div>
                    <div class="flex gap-1.5 overflow-x-auto hide-scrollbar">
                        ${STAGES.map(s => `
                            <button onclick="setDifficulty('${s.id}')" class="px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap ${currentDiff === s.id ? 'bg-brand-main text-brand-contrast' : 'bg-zinc-900 text-zinc-400'}">
                                ${s.name}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <!-- Reminders & Data -->
                <div class="glass-card rounded-3xl p-4 space-y-2 mb-6">
                    <button onclick="downloadICS()" class="w-full py-3 px-4 rounded-2xl bg-zinc-900/90 text-left text-xs font-bold text-white flex items-center justify-between active:scale-[0.99] transition-transform">
                        <span>7:00 AM Daily Calendar Alert (.ics)</span>
                        <i data-lucide="bell" class="w-4 h-4 text-brand-main"></i>
                    </button>
                    <button onclick="exportData()" class="w-full py-3 px-4 rounded-2xl bg-zinc-900/90 text-left text-xs font-bold text-white flex items-center justify-between active:scale-[0.99] transition-transform">
                        <span>Export Backup (JSON)</span>
                        <i data-lucide="upload" class="w-4 h-4 text-brand-main"></i>
                    </button>
                    <label class="w-full py-3 px-4 rounded-2xl bg-zinc-900/90 text-left text-xs font-bold text-white flex items-center justify-between cursor-pointer active:scale-[0.99] transition-transform">
                        <span>Import Backup File</span>
                        <i data-lucide="download" class="w-4 h-4 text-brand-main"></i>
                        <input type="file" accept=".json,application/json" class="hidden" onchange="importDataFromFile(event)">
                    </label>
                    <button onclick="openPasteImportModal()" class="w-full py-3 px-4 rounded-2xl bg-zinc-900/90 text-left text-xs font-bold text-zinc-300 flex items-center justify-between active:scale-[0.99] transition-transform">
                        <span>Paste Backup from Notes</span>
                        <i data-lucide="clipboard" class="w-4 h-4 text-zinc-500"></i>
                    </button>
                    <button onclick="resetProgress()" class="w-full py-3 px-4 rounded-2xl text-left text-xs font-bold text-rose-400 flex items-center justify-between">
                        <span>Reset All Data</span>
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
        }

        // --- 15. REMINDER (.ICS), BACKUP EXPORT/IMPORT & CATCH-UP ---
        function downloadICS() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dtStart = `${yyyy}${mm}${dd}T070000`;

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Fits Personal Fitness//EN',
                'BEGIN:VEVENT',
                `UID:fits-daily-7am-${Date.now()}@fits.app`,
                `DTSTAMP:${yyyy}${mm}${dd}T070000Z`,
                `DTSTART:${dtStart}`,
                'DURATION:PT15M',
                'RRULE:FREQ=DAILY',
                'SUMMARY:Morning Fitness Check-in (Fits)',
                'DESCRIPTION:Good morning! It is time to show up for yourself. Let us build strength one day at a time.',
                'BEGIN:VALARM',
                'TRIGGER:-PT0M',
                'ACTION:DISPLAY',
                'DESCRIPTION:Good morning! Time for your Fits workout or recovery check-in.',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fits-7am-reminder.ics';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);

            showInfoModal(
                "7:00 AM Calendar Alert Ready",
                "If iOS prompts you to open the calendar file, tap 'Add All' to save the recurring 7:00 AM alert. Alternatively, open Apple Reminders and create a daily 7:00 AM reminder titled 'Morning Fitness Check-in'."
            );
        }

        async function exportData() {
            const jsonStr = JSON.stringify(store.data, null, 2);
            const fileName = `fits-backup-${store.getTodayStr()}.json`;

            try {
                const file = new File([jsonStr], fileName, { type: 'application/json' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Fits Progress Backup',
                        files: [file]
                    });
                    showNotification("Backup shared/saved.");
                    return;
                }
            } catch (e) {
                if (e && e.name === 'AbortError') return;
            }

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Fits Progress Backup',
                        text: jsonStr
                    });
                    showNotification("Backup text shared.");
                    return;
                }
            } catch (e) {
                if (e && e.name === 'AbortError') return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(jsonStr).catch(() => {});
            }

            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-left pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-1">Backup Data (JSON)</h3>
                    <p class="text-xs text-zinc-400 mb-3">Copied to your clipboard! Paste this into Apple Notes or iCloud Drive so your progress is always safe.</p>
                    <textarea id="export-json-box" readonly rows="6" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-[11px] font-mono text-zinc-300 mb-4">${jsonStr}</textarea>
                    <div class="flex gap-2.5">
                        <button onclick="copyExportBox()" class="flex-1 py-3 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">Copy Again</button>
                        <button onclick="closeCustomDialog()" class="flex-1 py-3 rounded-full bg-zinc-800 text-zinc-300 font-bold text-xs">Done</button>
                    </div>
                </div>
            `;
        }

        function copyExportBox() {
            const box = document.getElementById('export-json-box');
            if (!box) return;
            box.select();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(box.value).catch(() => {});
            }
            showNotification("Backup copied to clipboard.");
        }

        function applyImportedJson(rawText) {
            try {
                const parsed = JSON.parse(rawText);
                if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.workouts) || !Array.isArray(parsed.checkIns)) {
                    showInfoModal("Invalid Backup File", "The selected backup is missing required workout or check-in records. Your existing progress was not changed.");
                    return;
                }
                store.data = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
                store.save();
                document.documentElement.className = `theme-${store.data.theme || 'lemon'}`;
                checkAchievements();
                closeCustomDialog();
                router.navigate('home');
                showNotification("Backup restored successfully!");
            } catch (err) {
                showInfoModal("Import Failed", "Could not read that JSON backup. Make sure you pasted the complete backup text without extra characters.");
            }
        }

        function importDataFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => applyImportedJson(e.target.result);
            reader.readAsText(file);
        }

        function openPasteImportModal() {
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-left pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-1">Paste Backup JSON</h3>
                    <p class="text-xs text-zinc-400 mb-3">Paste the backup text you previously saved in Apple Notes.</p>
                    <textarea id="import-paste-box" rows="6" placeholder='{"userName":"King", ...}' class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-[11px] font-mono text-white mb-4 outline-none focus:border-brand-main"></textarea>
                    <div class="flex gap-2.5">
                        <button onclick="closeCustomDialog()" class="flex-1 py-3 rounded-full bg-zinc-800 text-zinc-300 font-bold text-xs">Cancel</button>
                        <button onclick="applyImportedJson(document.getElementById('import-paste-box').value)" class="flex-1 py-3 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">Restore</button>
                    </div>
                </div>
            `;
        }

        function resetProgress() {
            showConfirmModal(
                "Reset All Progress?",
                "This will permanently erase all workouts, reflections, medals, FitCoins, and Fighter upgrades on this device.",
                () => {
                    localStorage.removeItem('mfj_data');
                    store.load();
                    router.navigate('home');
                    showNotification("All progress has been reset.");
                },
                "Erase Everything"
            );
        }

        // --- 16. CUSTOM DIALOGS & TOAST NOTIFICATIONS ---
        let dialogConfirmCallback = null;
        let dialogPromptCallback = null;

        function showInfoModal(title, message) {
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-center pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-2">${title}</h3>
                    <p class="text-xs text-zinc-300 leading-relaxed mb-6">${message}</p>
                    <button onclick="closeCustomDialog()" class="w-full py-3.5 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">Got It</button>
                </div>
            `;
        }

        function showConfirmModal(title, message, onConfirm, confirmLabel = "Confirm") {
            dialogConfirmCallback = onConfirm;
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-center pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-2">${title}</h3>
                    <p class="text-xs text-zinc-300 leading-relaxed mb-6">${message}</p>
                    <div class="flex gap-2.5">
                        <button onclick="closeCustomDialog()" class="flex-1 py-3.5 rounded-full bg-zinc-800 text-zinc-300 font-bold text-xs">Cancel</button>
                        <button onclick="executeConfirmCallback()" class="flex-1 py-3.5 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">${confirmLabel}</button>
                    </div>
                </div>
            `;
        }

        function executeConfirmCallback() {
            const cb = dialogConfirmCallback;
            closeCustomDialog();
            if (typeof cb === 'function') cb();
        }

        function showPromptModal(title, message, defaultValue, onSubmit) {
            dialogPromptCallback = onSubmit;
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-center pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-1">${title}</h3>
                    <p class="text-xs text-zinc-400 mb-4">${message}</p>
                    <input type="text" id="custom-prompt-input" value="${defaultValue || ''}" class="w-full bg-zinc-950 border border-zinc-700 rounded-full py-3 px-5 text-white text-center text-sm font-bold mb-5 focus:border-brand-main outline-none">
                    <div class="flex gap-2.5">
                        <button onclick="closeCustomDialog()" class="flex-1 py-3.5 rounded-full bg-zinc-800 text-zinc-300 font-bold text-xs">Cancel</button>
                        <button onclick="executePromptCallback()" class="flex-1 py-3.5 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">Save</button>
                    </div>
                </div>
            `;
        }

        function executePromptCallback() {
            const input = document.getElementById('custom-prompt-input');
            const val = input ? input.value : '';
            const cb = dialogPromptCallback;
            closeCustomDialog();
            if (typeof cb === 'function') cb(val);
        }

        function closeCustomDialog() {
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
        }

        let toastTimeout = null;
        function showNotification(htmlMessage) {
            const toast = document.getElementById('toast-banner');
            if (!toast) return;
            toast.innerHTML = `
                <i data-lucide="sparkles" class="w-4 h-4 text-brand-main shrink-0"></i>
                <span class="truncate">${htmlMessage}</span>
            `;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            if (typeof lucide !== 'undefined') lucide.createIcons();

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3400);
        }
    </script>
</body>
