<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Fitness">
    <title>My Fitness Journey</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe',
                            300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6',
                            600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            /* iOS safe area support to prevent overlap with home indicator */
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up-modal { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: #8b5cf6;
            border-color: #8b5cf6;
        }
        .custom-checkbox input:checked + div svg { display: block; }
        
        /* Activity Heatmap Graph */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col selection:bg-brand-200">

    <!-- App Container -->
    <div id="app" class="flex-1 overflow-y-auto hide-scrollbar pb-24 relative w-full max-w-md mx-auto bg-gray-50 shadow-2xl overflow-x-hidden">
        
        <!-- VIEWS -->
        <main id="view-home" class="view hidden p-5 fade-in"></main>
        <main id="view-workouts" class="view hidden p-5 fade-in"></main>
        <main id="view-progress" class="view hidden p-5 fade-in"></main>
        <main id="view-achievements" class="view hidden p-5 fade-in"></main>
        <main id="view-settings" class="view hidden p-5 fade-in"></main>

        <!-- Modals and Overlays -->
        <div id="workout-session" class="fixed inset-0 bg-white z-50 hidden flex-col w-full max-w-md mx-auto shadow-2xl slide-up-modal"></div>
        <div id="workout-complete" class="fixed inset-0 bg-brand-600 text-white z-[60] hidden flex-col w-full max-w-md mx-auto shadow-2xl slide-up-modal"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-white border-t border-gray-100 flex justify-between items-center px-6 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] z-40 shadow-[0_-4px_20px_-15px_rgba(0,0,0,0.1)]">
        <button onclick="router.navigate('home')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-brand-500 transition-colors" data-target="home">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="router.navigate('workouts')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-brand-500 transition-colors" data-target="workouts">
            <i data-lucide="activity" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Plan</span>
        </button>
        <button onclick="router.navigate('progress')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-brand-500 transition-colors" data-target="progress">
            <i data-lucide="bar-chart-2" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Stats</span>
        </button>
        <button onclick="router.navigate('achievements')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-brand-500 transition-colors" data-target="achievements">
            <i data-lucide="award" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Medals</span>
        </button>
        <button onclick="router.navigate('settings')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-brand-500 transition-colors" data-target="settings">
            <i data-lucide="settings" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Menu</span>
        </button>
    </nav>

    <!-- Application Logic -->
    <script>
        // --- 0. PWA SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(err => {
                    console.log('Service Worker registration failed: ', err);
                });
            });
        }

        // --- 1. DATA & CONFIGURATION ---
        const EXERCISE_DB = {
            squats: {
                name: "Bodyweight Squats", target: "Quads, Glutes, Core",
                desc: "Stand with feet shoulder-width apart. Lower your hips back and down as if sitting in a chair. Keep your chest up and back straight. Push through your heels to return to standing.",
                alt: "Hold onto a sturdy chair or doorframe for balance.",
                levels: { easy: { sets: 2, reps: 10, label: "10 reps" }, steady: { sets: 3, reps: 15, label: "15 reps" }, hard: { sets: 4, reps: 20, label: "20 reps (Slow)" } }
            },
            pushups_wall: {
                name: "Wall / Incline Push-ups", target: "Chest, Shoulders, Triceps",
                desc: "Place hands flat against a wall or elevated surface. Lower your chest towards the surface, keeping your body in a straight line, then push back up.",
                alt: "Adjust the height of the incline; the higher the surface, the easier it is.",
                levels: { easy: { sets: 2, reps: 8, label: "8 reps" }, steady: { sets: 3, reps: 12, label: "12 reps" }, hard: { sets: 3, reps: 15, label: "15 reps" } }
            },
            pushups_standard: {
                name: "Knee / Standard Push-ups", target: "Chest, Shoulders, Triceps, Core",
                desc: "Start in a high plank position. Lower your body until your chest is just above the floor. Push back up forcefully.",
                alt: "If standard push-ups are too hard, drop to your knees. Keep your hips in line with your torso.",
                levels: { easy: { sets: 2, reps: 8, label: "8 reps (Knees)" }, steady: { sets: 3, reps: 12, label: "12 reps" }, hard: { sets: 4, reps: 15, label: "15 reps" } }
            },
            glute_bridges: {
                name: "Glute Bridges", target: "Glutes, Hamstrings, Lower Back",
                desc: "Lie on your back with knees bent. Squeeze your glutes and push your hips towards the ceiling. Hold for a second at the top.",
                alt: "Focus on smaller ranges of motion if lifting high causes lower back discomfort.",
                levels: { easy: { sets: 2, reps: 10, label: "10 reps" }, steady: { sets: 3, reps: 15, label: "15 reps" }, hard: { sets: 4, reps: 20, label: "20 reps (2s Hold)" } }
            },
            single_leg_bridges: {
                name: "Single-leg Glute Bridges", target: "Glutes, Hamstrings",
                desc: "Lie on your back, knees bent. Extend one leg straight out. Push through the heel of the planted foot to raise your hips.",
                alt: "Revert to standard two-leg glute bridges if hips drop or it causes pain.",
                levels: { easy: { sets: 2, reps: 6, label: "6 reps / leg" }, steady: { sets: 3, reps: 10, label: "10 reps / leg" }, hard: { sets: 3, reps: 15, label: "15 reps / leg" } }
            },
            plank: {
                name: "Forearm Plank", target: "Core, Shoulders",
                desc: "Rest on your forearms and toes, keeping your body in a perfectly straight line from head to heels. Brace your core.",
                alt: "Drop to your knees while maintaining a straight line from head to knees.",
                levels: { easy: { sets: 2, reps: 20, label: "20 seconds" }, steady: { sets: 3, reps: 40, label: "40 seconds" }, hard: { sets: 3, reps: 60, label: "60 seconds" } }
            },
            lunges: {
                name: "Reverse Lunges", target: "Quads, Glutes, Hamstrings",
                desc: "Stand tall. Step one foot backward and lower your hips until both knees are bent at a 90-degree angle. Push off the back foot.",
                alt: "Hold onto a chair for balance, or don't step back as far.",
                levels: { easy: { sets: 2, reps: 6, label: "6 reps / leg" }, steady: { sets: 3, reps: 10, label: "10 reps / leg" }, hard: { sets: 4, reps: 12, label: "12 reps / leg" } }
            },
            bird_dog: {
                name: "Bird Dogs", target: "Core, Lower Back",
                desc: "Start on all fours. Simultaneously extend your right arm forward and left leg backward until parallel to the floor.",
                alt: "Extend only the arm, or only the leg, until balance improves.",
                levels: { easy: { sets: 2, reps: 10, label: "10 total reps" }, steady: { sets: 3, reps: 16, label: "16 total reps" }, hard: { sets: 3, reps: 20, label: "20 total reps (2s Hold)" } }
            },
            dead_bug: {
                name: "Dead Bugs", target: "Deep Core",
                desc: "Lie on your back, arms extended up, knees bent at 90 degrees. Slowly lower your right arm and left leg towards the floor without arching back.",
                alt: "Keep knees bent and tap heels to the floor instead of fully extending the leg.",
                levels: { easy: { sets: 2, reps: 10, label: "10 total reps" }, steady: { sets: 3, reps: 16, label: "16 total reps" }, hard: { sets: 3, reps: 20, label: "20 total reps" } }
            }
        };

        const SCHEDULE = [
            { day: 1, type: 'strength', title: 'Full Body A', desc: 'Fundamental strength building.', exercises: ['squats', 'pushups_wall', 'glute_bridges', 'plank'] }, // Mon
            { day: 2, type: 'recovery', title: 'Active Recovery', desc: 'Light stretching, mobility work, and hydration focus.' }, // Tue
            { day: 3, type: 'strength', title: 'Full Body B', desc: 'Focusing on stability and unilateral strength.', exercises: ['lunges', 'pushups_standard', 'bird_dog', 'plank'] }, // Wed
            { day: 4, type: 'recovery', title: 'Active Recovery', desc: 'Listen to your body. Light yoga or stretching.' }, // Thu
            { day: 5, type: 'strength', title: 'Full Body C', desc: 'Advanced core and lower body focus.', exercises: ['squats', 'pushups_standard', 'single_leg_bridges', 'dead_bug'] }, // Fri
            { day: 6, type: 'light', title: 'Optional Activity', desc: 'Go for a walk, do some light cleaning, or just stay gently active.' }, // Sat
            { day: 0, type: 'rest', title: 'Complete Rest', desc: 'Allow your muscles to recover and rebuild. No formal exercise today.' } // Sun
        ];

        const MEDALS = [
            { id: 'first_step', title: 'First Step', desc: 'Complete your first workout.' },
            { id: 'rhythm', title: 'Finding a Rhythm', desc: 'Complete 3 workouts.' },
            { id: 'momentum', title: 'Building Momentum', desc: 'Complete 5 workouts.' },
            { id: 'double_digits', title: 'Double Digits', desc: 'Complete 10 workouts.' },
            { id: 'consistency_champ', title: 'Consistency Champ', desc: 'Complete 20 workouts.' },
            { id: 'strength_builder', title: 'Strength Builder', desc: 'Complete 30 workouts.' },
            { id: 'showing_up', title: 'Showing Up', desc: 'Complete check-ins on 5 different days.' },
            { id: 'weekly_commitment', title: 'Weekly Commitment', desc: 'Log 3 strength workouts in a Mon-Sun week.' },
            { id: 'two_weeks', title: 'Two-Week Journey', desc: 'Record activity across 14 different days.' }
        ];

        // --- 2. STATE MANAGEMENT ---
        const defaultState = {
            difficulty: 'steady', 
            workouts: [], 
            checkIns: [], 
            achievements: [], 
            startDate: new Date().toISOString()
        };

        const store = {
            data: {},
            load() {
                const saved = localStorage.getItem('mfj_data');
                if (saved) {
                    try {
                        this.data = JSON.parse(saved);
                        // Backwards compatibility checks
                        if(!this.data.checkIns) this.data.checkIns = [];
                        if(!this.data.workouts) this.data.workouts = [];
                        if(!this.data.achievements) this.data.achievements = [];
                    } catch(e) {
                        this.data = JSON.parse(JSON.stringify(defaultState));
                    }
                } else {
                    this.data = JSON.parse(JSON.stringify(defaultState));
                }
            },
            save() {
                localStorage.setItem('mfj_data', JSON.stringify(this.data));
            },
            getTodayStr() {
                const d = new Date();
                return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            },
            hasCompletedWorkoutToday() {
                const today = this.getTodayStr();
                return this.data.workouts.some(w => w.date.startsWith(today));
            },
            getTodayCheckIn() {
                const today = this.getTodayStr();
                return this.data.checkIns.find(c => c.date.startsWith(today));
            }
        };

        // --- 3. ACHIEVEMENT LOGIC ---
        function checkAchievements() {
            const unlocked = store.data.achievements.map(a => a.id);
            const today = store.getTodayStr();
            let newUnlocks = [];

            const grant = (id) => {
                if (!unlocked.includes(id)) {
                    store.data.achievements.push({ id, date: today });
                    newUnlocks.push(id);
                }
            };

            const wCount = store.data.workouts.length;
            
            // Unique Check-in Days
            const uniqueCheckInDates = new Set(store.data.checkIns.map(c => c.date.split('T')[0]));
            const cCount = uniqueCheckInDates.size;

            // Unique Activity Days (Workout OR Check-in)
            const uniqueActivityDates = new Set([
                ...store.data.workouts.map(w => w.date.split('T')[0]),
                ...store.data.checkIns.filter(c => c.activity).map(c => c.date.split('T')[0])
            ]);
            const aCount = uniqueActivityDates.size;

            if (wCount >= 1) grant('first_step');
            if (wCount >= 3) grant('rhythm');
            if (wCount >= 5) grant('momentum');
            if (wCount >= 10) grant('double_digits');
            if (wCount >= 20) grant('consistency_champ');
            if (wCount >= 30) grant('strength_builder');
            if (cCount >= 5) grant('showing_up');
            if (aCount >= 14) grant('two_weeks');

            // Weekly commitment: 3 strength workouts in the *current* Mon-Sun week
            if (!unlocked.includes('weekly_commitment')) {
                const curr = new Date();
                const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1); // Get Monday
                const monday = new Date(curr.setDate(first));
                monday.setHours(0,0,0,0);
                
                let currentWeekWorkouts = 0;
                store.data.workouts.forEach(w => {
                    const wDate = new Date(w.date);
                    if (wDate >= monday && w.type === 'strength') {
                        currentWeekWorkouts++;
                    }
                });
                if (currentWeekWorkouts >= 3) grant('weekly_commitment');
            }

            if (newUnlocks.length > 0) {
                store.save();
                showNotification(`🏆 Achievement Unlocked: ${MEDALS.find(m=>m.id===newUnlocks[0]).title}!`);
            }
        }

        // --- 4. ROUTER & UI UTILS ---
        const router = {
            current: 'home',
            navigate(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
                document.getElementById(`view-${viewId}`).classList.remove('hidden');
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if(btn.dataset.target === viewId) {
                        btn.classList.remove('text-gray-400');
                        btn.classList.add('text-brand-500');
                    } else {
                        btn.classList.add('text-gray-400');
                        btn.classList.remove('text-brand-500');
                    }
                });
                
                this.current = viewId;
                renderView(viewId);
                window.scrollTo(0,0);
            }
        };

        function renderView(viewId) {
            const container = document.getElementById(`view-${viewId}`);
            if (viewId === 'home') renderHome(container);
            if (viewId === 'workouts') renderWorkouts(container);
            if (viewId === 'progress') renderProgress(container);
            if (viewId === 'achievements') renderAchievements(container);
            if (viewId === 'settings') renderSettings(container);
            lucide.createIcons();
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-[100] fade-in font-medium text-sm flex items-center gap-2 max-w-[90%] w-max text-center';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- 5. RENDER FUNCTIONS ---
        
        function getWeeklyStripHtml() {
            const orderedDays = [1, 2, 3, 4, 5, 6, 0]; // Mon-Sun
            const labels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            const todayNum = new Date().getDay();
            const todayDateStr = store.getTodayStr();
            
            // Reconstruct the dates for the current Mon-Sun week
            const curr = new Date();
            const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
            
            let html = '<div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">';
            
            orderedDays.forEach((dayNum, i) => {
                const dayDate = new Date(curr.setDate(first + i));
                const dateStr = dayDate.toISOString().split('T')[0];
                const plan = SCHEDULE.find(s => s.day === dayNum);
                
                // Determine completion
                const workoutDone = store.data.workouts.some(w => w.date.startsWith(dateStr));
                const checkInDone = store.data.checkIns.find(c => c.date.startsWith(dateStr));
                const isCompleted = workoutDone || (checkInDone && checkInDone.activity);
                
                let style = 'bg-gray-100 text-gray-400 border border-gray-200'; // Default / Future
                
                if (isCompleted) {
                    style = 'bg-brand-500 text-white shadow-md shadow-brand-200';
                } else if (dateStr < todayDateStr) {
                    style = 'bg-gray-50 text-gray-300 border border-gray-100'; // Missed past day
                } else if (dateStr === todayDateStr) {
                    style = 'bg-white text-brand-600 border-2 border-brand-500 font-bold'; // Today
                } else if (plan.type === 'rest') {
                    style = 'bg-gray-50 text-gray-400 border border-gray-200 border-dashed'; // Future Rest
                }

                html += `
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs ${style} transition-colors">
                            ${isCompleted ? '<i data-lucide="check" class="w-4 h-4"></i>' : labels[i]}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function renderHome(container) {
            const hour = new Date().getHours();
            let greeting = 'Good evening';
            if (hour < 12) greeting = 'Good morning';
            else if (hour < 17) greeting = 'Good afternoon';

            const todayNum = new Date().getDay();
            const todayPlan = SCHEDULE.find(s => s.day === todayNum);
            
            const isCompleted = store.hasCompletedWorkoutToday() || (store.getTodayCheckIn()?.activity);
            const hasCheckedIn = !!store.getTodayCheckIn();
            const nextMedal = MEDALS.find(m => !store.data.achievements.find(a => a.id === m.id));

            container.innerHTML = `
                <div class="mb-5 mt-2">
                    <h1 class="text-2xl font-bold text-gray-900">${greeting},</h1>
                    <p class="text-gray-500 text-sm mt-1">Let's build strength one day at a time.</p>
                </div>
                
                ${getWeeklyStripHtml()}

                <!-- Today's Plan Card -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-brand-50 rounded-full blur-3xl -mr-10 -mt-10"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-brand-600 font-semibold text-xs tracking-wider uppercase mb-1">Today's Plan</p>
                                <h2 class="text-xl font-bold text-gray-900">${todayPlan.title}</h2>
                            </div>
                            <div class="bg-brand-50 p-2 rounded-xl text-brand-500">
                                <i data-lucide="${todayPlan.type === 'strength' ? 'dumbbell' : (todayPlan.type === 'rest' ? 'moon' : 'heart')}" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <p class="text-gray-600 text-sm mb-6 line-clamp-2">${todayPlan.desc}</p>
                        
                        ${isCompleted ? `
                            <div class="bg-green-50 text-green-700 p-4 rounded-2xl flex items-center gap-3">
                                <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                                <div>
                                    <p class="font-semibold text-sm">Activity Completed!</p>
                                    <p class="text-xs opacity-80">Great job showing up today.</p>
                                </div>
                            </div>
                        ` : `
                            <button onclick="${todayPlan.type === 'strength' ? 'startWorkout()' : 'openCheckIn()'}" class="w-full bg-brand-600 text-white rounded-2xl py-3.5 font-semibold shadow-md shadow-brand-200 active:scale-95 transition-transform flex justify-center items-center gap-2">
                                ${todayPlan.type === 'strength' ? '<i data-lucide="play" class="w-4 h-4"></i> Start Workout' : '<i data-lucide="check-square" class="w-4 h-4"></i> Log Recovery'}
                            </button>
                        `}
                    </div>
                </div>

                ${!hasCheckedIn && isCompleted ? `
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <i data-lucide="coffee" class="text-blue-500 w-5 h-5"></i>
                        <span class="text-sm text-blue-900 font-medium">Don't forget daily check-in!</span>
                    </div>
                    <button onclick="openCheckIn()" class="text-xs font-bold text-blue-700 bg-white px-3 py-1.5 rounded-full shadow-sm">Do it now</button>
                </div>
                ` : ''}

                <!-- Next Achievement -->
                ${nextMedal ? `
                <div class="bg-gradient-to-r from-gray-900 to-gray-800 rounded-3xl p-5 shadow-lg text-white mb-4">
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-800 p-3 rounded-2xl border border-gray-700">
                            <i data-lucide="lock" class="w-6 h-6 text-gray-400"></i>
                        </div>
                        <div>
                            <p class="text-gray-400 text-xs font-medium mb-1">Next Milestone</p>
                            <h3 class="font-bold text-base">${nextMedal.title}</h3>
                            <p class="text-gray-300 text-xs mt-1 opacity-80">${nextMedal.desc}</p>
                        </div>
                    </div>
                </div>
                ` : ''}
            `;
        }

        function renderWorkouts(container) {
            let html = `
                <div class="mb-6 mt-2 flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Weekly Plan</h1>
                        <p class="text-gray-500 text-sm mt-1">Consistency over intensity.</p>
                    </div>
                    <div class="bg-brand-100 text-brand-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                        ${store.data.difficulty} Level
                    </div>
                </div>
                <div class="space-y-4 pb-4">
            `;

        function renderProgress(container) {

        function changeDifficulty(level) {

        // --- 6. WORKOUT SESSION & WARMUP LOGIC ---
        let activeWorkout = null;
        let restInterval = null;

        function startWorkout() {
            const todayNum = new Date().getDay();
            const plan = SCHEDULE.find(s => s.day === todayNum);
            
            // Allow testing today's workout even if already done (prevent double log in finishWorkout)
            if (store.hasCompletedWorkoutToday()) {
                if(!confirm("You've already completed a workout today. Do you want to do it again? (It won't duplicate in history)")) {
                    return;
                }
            }

            activeWorkout = {
                plan: plan,
                exIndex: 0,
                exercises: plan.exercises.map(exKey => {
                    const ex = EXERCISE_DB[exKey];
                    const params = ex.levels[store.data.difficulty];
                    return { id: exKey, name: ex.name, sets: params.sets, reps: params.label, completedSets: 0 };
                })
            };

            const overlay = document.getElementById('workout-session');
            overlay.classList.remove('hidden');
            renderWarmup(); // Start with warmup
        }

        function renderWarmup() {
            const overlay = document.getElementById('workout-session');
            overlay.innerHTML = `

                        <p class="text-sm font-semibold text-gray-900">Pre-Workout</p>
                        <div class="w-10"></div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-6 pb-24 relative">

                        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-5 mb-6 space-y-4">

                            <div class="flex items-center gap-3"><div class="w-2 h-2 bg-brand-400 rounded-full"></div><p class="text-sm font-medium text-gray-700">Arm circles (30s forward, 30s backward)</p></div>
                            <div class="flex items-center gap-3"><div class="w-2 h-2 bg-brand-400 rounded-full"></div><p class="text-sm font-medium text-gray-700">Hip circles (30s each direction)</p></div>
                            <div class="flex items-center gap-3"><div class="w-2 h-2 bg-brand-400 rounded-full"></div><p class="text-sm font-medium text-gray-700">Gentle bodyweight squats (10 reps)</p></div>
                        </div>

                        <div class="bg-red-50 border border-red-100 rounded-2xl p-4 flex gap-3 items-start">
                            <i data-lucide="alert-triangle" class="text-red-500 w-5 h-5 flex-shrink-0 mt-0.5"></i>
                            <p class="text-xs text-red-800 leading-relaxed font-medium">Safety First: Stop exercising immediately if you experience sharp pain, dizziness, nausea, or unusual shortness of breath.</p>
                        </div>
                    </div>
                    <div class="px-5 py-4 border-t border-gray-100 bg-white pb-[calc(1rem+env(safe-area-inset-bottom))]">
                        <button onclick="renderActiveWorkout()" class="w-full bg-brand-600 text-white rounded-2xl py-4 font-bold shadow-xl shadow-brand-200 active:scale-95 transition-transform">
                            I'm Warmed Up ➔
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderActiveWorkout() {
            const overlay = document.getElementById('workout-session');
            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            const fullExDetail = EXERCISE_DB[exData.id];
            const isLastEx = activeWorkout.exIndex === activeWorkout.exercises.length - 1;
            const progressPct = ((activeWorkout.exIndex) / activeWorkout.exercises.length) * 100;

            let setsHtml = '';
            for (let i = 0; i < exData.sets; i++) {
                const isChecked = i < exData.completedSets;
                setsHtml += `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border ${isChecked ? 'border-brand-300 bg-brand-50' : 'border-gray-200'} mb-3 transition-colors">
                        <span class="font-bold text-gray-700">Set ${i + 1} <span class="text-sm font-normal text-gray-500 ml-2">${exData.reps}</span></span>
                        <label class="custom-checkbox relative cursor-pointer">
                            <input type="checkbox" class="sr-only" ${isChecked ? 'checked disabled' : ''} onchange="completeSet(${i})">
                            <div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center transition-colors bg-white shadow-sm">
                                <svg class="w-5 h-5 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </label>
                    </div>
                `;
            }

            overlay.innerHTML = `
                <div class="flex-1 flex flex-col pt-safe bg-white h-full">
                    <!-- Header -->
                    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                        <button onclick="confirmExitWorkout()" class="text-gray-400 hover:text-gray-700 p-2 -ml-2">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                        <div class="text-center">
                            <p class="text-[10px] font-bold text-brand-600 uppercase tracking-widest">${activeWorkout.plan.title}</p>
                            <p class="text-sm font-semibold text-gray-900">Exercise ${activeWorkout.exIndex + 1} of ${activeWorkout.exercises.length}</p>
                        </div>
                        <div class="w-10"></div>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-100 h-1.5"><div class="bg-brand-500 h-1.5 transition-all duration-500 rounded-r-full" style="width: ${progressPct}%"></div></div>

                    <!-- Content -->
                    <div class="flex-1 overflow-y-auto p-5 pb-24 hide-scrollbar relative">
                        <h2 class="text-3xl font-bold text-gray-900 mb-2">${fullExDetail.name}</h2>
                        <div class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-700 bg-brand-100 px-3 py-1 rounded-full mb-4 border border-brand-200">
                            <i data-lucide="target" class="w-3.5 h-3.5"></i> ${fullExDetail.target}
                        </div>
                        
                        <p class="text-gray-600 text-sm mb-5 leading-relaxed">${fullExDetail.desc}</p>
                        
                        <div class="bg-orange-50 border border-orange-100 rounded-2xl p-4 mb-6 text-sm">
                            <p class="font-bold text-orange-800 mb-1 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> Beginner Alternative</p>
                            <p class="text-orange-700 opacity-90">${fullExDetail.alt}</p>
                        </div>

                        <div class="mb-2">
                            <h3 class="font-bold text-gray-900 text-lg mb-4">Track Sets</h3>
                            ${setsHtml}
                        </div>
                    </div>
                    
                    <!-- Bottom Action -->
                    <div class="px-5 py-4 border-t border-gray-100 bg-white pb-[calc(1rem+env(safe-area-inset-bottom))]">
                        <button onclick="nextExercise()" id="next-ex-btn" class="w-full bg-gray-200 text-gray-400 rounded-2xl py-4 font-bold transition-all" disabled>
                            ${isLastEx ? 'Complete Workout 🏆' : 'Next Exercise ➔'}
                        </button>
                    </div>
                    
                    <!-- Rest Timer Overlay -->
                    <div id="rest-timer" class="absolute inset-0 bg-brand-600 text-white z-50 hidden flex-col items-center justify-center flex-1">
                        <h3 class="text-2xl font-bold mb-2 opacity-90">Rest & Recover</h3>
                        <p class="text-brand-200 mb-8 text-sm">Breathe deep. Get ready.</p>
                        <div class="w-48 h-48 rounded-full border-8 border-brand-400 flex items-center justify-center mb-8 relative shadow-inner bg-brand-700">
                            <span id="timer-display" class="text-6xl font-bold">45</span>
                        </div>
                        <button onclick="skipRest()" class="bg-white text-brand-700 px-8 py-3 rounded-full font-bold shadow-lg active:scale-95 transition-transform">Skip Rest</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            checkAllSetsCompleted();
        }

        function completeSet(index) {
            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            if (index === exData.completedSets) {
                exData.completedSets++;
                renderActiveWorkout();
                
                const isLastEx = activeWorkout.exIndex === activeWorkout.exercises.length - 1;
                const isLastSet = exData.completedSets === exData.sets;
                if (!(isLastEx && isLastSet)) {
                    startRestTimer();
                }
            }
        }

        function checkAllSetsCompleted() {
            const exData = activeWorkout.exercises[activeWorkout.exIndex];
            const btn = document.getElementById('next-ex-btn');
            if (exData.completedSets === exData.sets) {
                btn.disabled = false;
                btn.className = "w-full bg-brand-600 text-white rounded-2xl py-4 font-bold shadow-xl shadow-brand-200 active:scale-95 transition-transform";
            }
        }

        function startRestTimer() {
            const timerEl = document.getElementById('rest-timer');
            const displayEl = document.getElementById('timer-display');
            timerEl.classList.remove('hidden');
            timerEl.classList.add('flex');
            
            let time = store.data.difficulty === 'easy' ? 60 : (store.data.difficulty === 'steady' ? 45 : 30);
            displayEl.innerText = time;
            
            restInterval = setInterval(() => {
                time--;
                displayEl.innerText = time;
                if (time <= 0) {
                    skipRest();
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(restInterval);
            const timerEl = document.getElementById('rest-timer');
            timerEl.classList.add('hidden');
            timerEl.classList.remove('flex');
        }

        function nextExercise() {
            if (activeWorkout.exIndex < activeWorkout.exercises.length - 1) {
                activeWorkout.exIndex++;
                renderActiveWorkout();
            } else {
                finishWorkout();
            }
        }

        function finishWorkout() {
            // Prevent duplicate saves on same day
            if(!store.hasCompletedWorkoutToday()) {
                // Save deep copy of detailed historical record
                store.data.workouts.push({
                    date: store.getTodayStr(),
                    type: activeWorkout.plan.type,
                    title: activeWorkout.plan.title,
                    difficulty: store.data.difficulty,
                    exercises: activeWorkout.exercises.map(ex => ({
                        name: ex.name,
                        sets: ex.completedSets,
                        reps: ex.reps
                    }))
                });
                store.save();
                checkAchievements();
            }
            
            closeWorkoutSession();
            showCompletionScreen();
        }

        function confirmExitWorkout() {
            if (confirm("Are you sure you want to end this workout early? Progress won't be saved.")) {
                closeWorkoutSession();
            }
        }

        function closeWorkoutSession() {
            clearInterval(restInterval);
            const overlay = document.getElementById('workout-session');
            overlay.classList.add('hidden');
        }

        function showCompletionScreen() {
            const totalSets = activeWorkout.exercises.reduce((acc, curr) => acc + curr.completedSets, 0);
            const exCount = activeWorkout.exercises.length;
            
            const overlay = document.getElementById('workout-complete');
            overlay.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center pt-safe bg-gradient-to-b from-brand-500 to-brand-700 h-full">
                    <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6">
                        <i data-lucide="check-circle" class="w-12 h-12 text-white"></i>
                    </div>
                    <h2 class="text-4xl font-bold mb-2">Workout Complete!</h2>
                    <p class="text-brand-100 mb-8 font-medium">You showed up and put in the work.</p>
                    
                    <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 w-full mb-8 border border-white/20">
                        <h3 class="text-xl font-bold mb-1">${activeWorkout.plan.title}</h3>
                        <p class="text-brand-100 text-sm uppercase tracking-widest mb-6 font-bold">${store.data.difficulty} Level</p>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-3xl font-bold">${exCount}</p>
                                <p class="text-xs text-brand-100 uppercase tracking-widest">Exercises</p>
                            </div>
                            <div>
                                <p class="text-3xl font-bold">${totalSets}</p>
                                <p class="text-xs text-brand-100 uppercase tracking-widest">Sets</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-full space-y-3 pb-[calc(1rem+env(safe-area-inset-bottom))] mt-auto">
                        <button onclick="router.navigate('home'); closeCompletionScreen();" class="w-full bg-white text-brand-700 rounded-full py-4 font-bold shadow-xl active:scale-95 transition-transform text-lg">
                            Return to Dashboard
                        </button>
                        ${!store.getTodayCheckIn() ? `
                        <button onclick="closeCompletionScreen(); openCheckIn();" class="w-full bg-brand-800 text-white rounded-full py-4 font-bold active:scale-95 transition-transform border border-brand-400">
                            Log Daily Check-in
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
            lucide.createIcons();
            activeWorkout = null; // Clear state
        }
        
        function closeCompletionScreen() {
            document.getElementById('workout-complete').classList.add('hidden');
        }

        // --- 7. CHECK-IN LOGIC ---
        function openCheckIn(editDate = null) {
            const dateToEdit = editDate || store.getTodayStr();
            const existing = store.data.checkIns.find(c => c.date.startsWith(dateToEdit));
            const isToday = dateToEdit === store.getTodayStr();
            
            const overlay = document.getElementById('workout-session');
            overlay.innerHTML = `
                <div class="flex-1 flex flex-col pt-safe bg-gray-50 h-full">
                    <div class="px-5 py-4 flex items-center justify-between bg-white shadow-sm z-10">
                        <h2 class="text-xl font-bold text-gray-900">${isToday ? 'Daily Check-in' : 'Edit Check-in'}</h2>
                        <button onclick="closeWorkoutSession()" class="text-gray-400 hover:text-gray-700 p-2 -mr-2"><i data-lucide="x" class="w-6 h-6"></i></button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-5 pb-24">
                        <p class="text-gray-600 text-sm mb-6">Take a moment to reflect on your day. Honesty is key to progress.</p>
                        
                        <div class="space-y-3 mb-6">
                            <label class="flex items-start gap-3 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer custom-checkbox">
                                <input type="checkbox" id="chk-activity" class="sr-only" ${existing?.activity ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-md border-2 border-gray-300 flex-shrink-0 flex items-center justify-center mt-0.5">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-900 text-sm">I completed today's plan</p>
                                    <p class="text-xs text-gray-500">Workout or designated recovery.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-3 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer custom-checkbox">
                                <input type="checkbox" id="chk-water" class="sr-only" ${existing?.water ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-md border-2 border-gray-300 flex-shrink-0 flex items-center justify-center mt-0.5">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-900 text-sm">I drank enough water</p>
                                    <p class="text-xs text-gray-500">Staying hydrated supports muscle growth.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-3 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer custom-checkbox">
                                <input type="checkbox" id="chk-sleep" class="sr-only" ${existing?.sleep ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-md border-2 border-gray-300 flex-shrink-0 flex items-center justify-center mt-0.5">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-900 text-sm">I made time for adequate sleep</p>
                                    <p class="text-xs text-gray-500">Recovery happens while you rest.</p>
                                </div>
                            </label>
                            
                            <label class="flex items-start gap-3 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer custom-checkbox">
                                <input type="checkbox" id="chk-energy" class="sr-only" ${existing?.energy ? 'checked' : ''}>
                                <div class="w-6 h-6 rounded-md border-2 border-gray-300 flex-shrink-0 flex items-center justify-center mt-0.5">
                                    <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-900 text-sm">My energy levels felt good</p>
                                    <p class="text-xs text-gray-500">Checking in with your body.</p>
                                </div>
                            </label>
                        </div>
                        
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">
                            <h3 class="font-bold text-gray-900 text-sm mb-2">Personal Notes</h3>
                            <textarea id="chk-notes" class="w-full bg-gray-50 rounded-xl p-3 text-sm border-0 focus:ring-2 focus:ring-brand-500 outline-none resize-none hide-scrollbar" rows="4" placeholder="How did today feel? Any struggles or wins?">${existing?.notes || ''}</textarea>
                        </div>
                        
                        <button onclick="saveCheckIn('${dateToEdit}')" class="w-full bg-brand-600 text-white rounded-2xl py-4 font-bold shadow-xl shadow-brand-200 active:scale-95 transition-transform">Save Check-in</button>
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
            lucide.createIcons();
            
            // Pre-fill activity if workout done today and no existing check-in
            if (!existing && store.hasCompletedWorkoutToday() && isToday) {
                document.getElementById('chk-activity').checked = true;
            }
        }

        function saveCheckIn(dateStr) {
            const index = store.data.checkIns.findIndex(c => c.date.startsWith(dateStr));
            const newRecord = {
                date: dateStr, // keeping original date format
                activity: document.getElementById('chk-activity').checked,
                water: document.getElementById('chk-water').checked,
                sleep: document.getElementById('chk-sleep').checked,
                energy: document.getElementById('chk-energy').checked,
                notes: document.getElementById('chk-notes').value.trim()
            };

            if (index !== -1) {
                store.data.checkIns[index] = newRecord; // Update
            } else {
                store.data.checkIns.push(newRecord); // Insert
            }
            
            store.save();
            checkAchievements();
            closeWorkoutSession();
            showNotification("Check-in saved!");
            if(router.current === 'progress') { renderProgress(document.getElementById('view-progress')); }
            else { router.navigate('home'); }
        }

        // --- 8. UTILITIES (Export/Import/ICS) ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "my_fitness_journey_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    // Validation
                    if (imported && Array.isArray(imported.workouts) && Array.isArray(imported.checkIns)) {
                        if(confirm("Importing will overwrite your current progress. Continue?")) {
                            store.data = imported;
                            // Ensure structure exists
                            if(!store.data.achievements) store.data.achievements = [];
                            store.save();
                            checkAchievements(); // recalculate just in case
                            showNotification("Data imported successfully!");
                            router.navigate('home');
                        }
                    } else {
                        alert("Invalid backup file format. Progress was not changed.");
                    }
                } catch (err) {
                    alert("Error reading file. Make sure it's a valid JSON backup.");
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm("Are you absolutely sure you want to delete ALL progress? This cannot be undone.")) {
                localStorage.removeItem('mfj_data');
                store.load();
                router.navigate('home');
                showNotification("All data has been reset.");
            }
        }

        function downloadICS() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dtStart = `${yyyy}${mm}${dd}T070000`; // Local time

            // Correct VEVENT and VALARM format for iOS Reminders / Calendar
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//My Fitness Journey//EN
BEGIN:VEVENT
SUMMARY:Morning Fitness Check-in
DESCRIPTION:Time to show up for yourself. Let's build strength one day at a time.
RRULE:FREQ=DAILY
DTSTART:${dtStart}
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:Morning Fitness Check-in Reminder
TRIGGER:-PT0M
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fitness-reminder.ics';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setTimeout(() => {
                alert("iPhone Installation:\n\n1. Safari will prompt you to download the file.\n2. Tap 'Download'.\n3. Tap the Downloads icon (↓) in the Safari address bar, open the file, and tap 'Add All' to save the recurring reminder with an alarm.");
            }, 600);
        }

        // --- 9. INITIALIZATION ---
        window.onload = () => {
            store.load();
            checkAchievements(); // Check on load to cover edge cases
            router.navigate('home');
        };

    </script>
</body>
</html>
