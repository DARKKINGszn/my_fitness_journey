    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            main: 'var(--brand-main)',
                            bg: 'var(--brand-bg)',
                            contrast: 'var(--brand-contrast)',
                            muted: 'var(--brand-muted)'
                        }
                    }
                }
            }
        }

    <style>
        /* THEME VARIABLES */
        :root, .theme-lemon {
            --brand-main: #e0ff33;
            --brand-bg: #222a00;
            --brand-contrast: #000000;
            --brand-muted: #5e7300;
        }
        .theme-purple {
            --brand-main: #a78bfa;
            --brand-bg: #2e1a47;
            --brand-contrast: #000000;
            --brand-muted: #6d28d9;
        }
        .theme-cyan {
            --brand-main: #22d3ee;
            --brand-bg: #083344;
            --brand-contrast: #000000;
            --brand-muted: #0e7490;
        }
        .theme-rose {
            --brand-main: #fb7185;
            --brand-bg: #4c0519;
            --brand-contrast: #000000;
            --brand-muted: #be123c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up-modal { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Custom Rounded Checkbox */
        .custom-checkbox input:checked + div {
            background-color: var(--brand-main);
            border-color: var(--brand-main);
        }
        .custom-checkbox input:checked + div svg { 
            display: block; 
            color: var(--brand-contrast);
        }
        
        /* Activity Heatmap Graph */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            border-radius: 9999px;
        }

        /* Safe area spacing for iOS status bar */
        .ios-safe-top {
            padding-top: calc(env(safe-area-inset-top) + 1.75rem);
        }
        .ios-safe-modal {
            padding-top: calc(env(safe-area-inset-top) + 0.75rem);
        }
        
        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(24, 24, 27, 0.68);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(63, 63, 70, 0.45);
        }

        /* Floating Pill Liquid Glass Navigation Bar */
        .liquid-glass-nav {
            background: linear-gradient(180deg, rgba(44, 44, 48, 0.56) 0%, rgba(16, 16, 19, 0.74) 100%);
            backdrop-filter: blur(26px) saturate(190%);
            -webkit-backdrop-filter: blur(26px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
                0 20px 42px -10px rgba(0, 0, 0, 0.88);
        }

        /* Fighter Floating & Battle Animations */
        @keyframes floatPet {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .pet-float {
            animation: floatPet 3s ease-in-out infinite;
        }
        @keyframes popScale {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-2deg); }
            40% { transform: translateX(8px) rotate(2deg); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .hit-shake {
            animation: hitShake 0.35s ease-in-out;
        }
    </style>
</head>

                const yyyy = dateObj.getFullYear();

        // --- 3. STREAK & PROGRESSION CALCULATORS ---
        function getAllActiveDatesSet() {
            const set = new Set();
            store.data.workouts.forEach(w => {
                if (w.date) set.add(w.date.slice(0, 10));
            });
            store.data.checkIns.forEach(c => {
                if (c.date && c.activity) set.add(c.date.slice(0, 10));
            });
            (store.data.streakBridges || []).forEach(d => set.add(d));
            return set;
        }

        function getStreakInfo() {
            const activeSet = getAllActiveDatesSet();
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = store.getDateStr(today);

            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = store.getDateStr(yesterday);

            let streak = 0;
            let cursor = new Date(today);
            if (!activeSet.has(todayStr)) {
                if (activeSet.has(yesterdayStr)) {
                    cursor = new Date(yesterday);
                } else {
                    const sortedDates = Array.from(activeSet).sort();
                    if (sortedDates.length > 0 && store.data.streakRestores > 0) {
                        const lastActiveStr = sortedDates[sortedDates.length - 1];
                        const [ly, lm, ld] = lastActiveStr.split('-').map(Number);
                        const lastDate = new Date(ly, lm - 1, ld);
                        const missedDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24)) - 1;

                        let priorStreak = 0;
                        let pCursor = new Date(lastDate);
                        while (activeSet.has(store.getDateStr(pCursor))) {
                            priorStreak++;
                            pCursor.setDate(pCursor.getDate() - 1);
                        }

                        if (missedDays >= 1 && priorStreak > 0) {
                            return {
                                current: 0,
                                canRestore: true,
                                missedDays,
                                priorStreak,
                                lastActiveStr
                            };
                        }
                    }
                    return { current: 0, canRestore: false, missedDays: 0, priorStreak: 0 };
                }
            }

            while (activeSet.has(store.getDateStr(cursor))) {
                streak++;
                cursor.setDate(cursor.getDate() - 1);
            }

            return { current: streak, canRestore: false, missedDays: 0, priorStreak: 0 };
        }

        function useStreakRestore() {
            const info = getStreakInfo();
            if (!info.canRestore || store.data.streakRestores <= 0) return;

            showConfirmModal(
                "Use Streak Restore?",
                `Bridge ${info.missedDays} missed day(s) to recover your ${info.priorStreak}-day streak? You will have ${store.data.streakRestores - 1} restore(s) remaining.`,
                () => {
                    const [ly, lm, ld] = info.lastActiveStr.split('-').map(Number);
                    const cursor = new Date(ly, lm - 1, ld + 1);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    while (cursor < today) {
                        const dStr = store.getDateStr(cursor);
                        if (!store.data.streakBridges.includes(dStr)) {
                            store.data.streakBridges.push(dStr);
                        }
                        cursor.setDate(cursor.getDate() + 1);
                    }

                    store.data.streakRestores -= 1;
                    store.save();
                    checkAchievements();
                    renderView(router.current);
                    showNotification(`Phoenix Restore activated! ${info.priorStreak}-day streak recovered.`);
                },
                "Restore Streak"
            );
        }

        function getFighterStats() {
            const stageIdx = Math.max(0, STAGES.findIndex(s => s.id === store.data.difficulty));
            const totalWorkouts = store.data.workouts.length;
            const streak = getStreakInfo().current;
            const pet = store.data.pet;

            let gearBonusAtk = 0;
            let gearBonusDef = 0;
            let gearBonusHp = 0;
            if (pet.hat !== 'none') gearBonusHp += 20;
            if (pet.glasses !== 'none') gearBonusAtk += 4;
            if (pet.gear !== 'none') gearBonusAtk += 6;
            if (pet.aura !== 'none') gearBonusDef += 5;

            const maxHp = 100 + (stageIdx * 45) + (totalWorkouts * 3) + gearBonusHp;
            const atk = 16 + (stageIdx * 8) + Math.floor(totalWorkouts * 0.8) + gearBonusAtk;
            const def = 4 + (stageIdx * 4) + Math.floor(streak * 0.5) + gearBonusDef;
            const crit = Math.min(45, 10 + (stageIdx * 5) + streak);

            return { stageIdx, maxHp, atk, def, crit, streak };
        }

        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 200;
                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    store.data.profilePic = canvas.toDataURL('image/jpeg', 0.72);
                    store.save();
                    renderView(router.current);
                    showNotification("Profile picture updated.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 8. ACHIEVEMENTS ENGINE ---
        function getMedalProgress(medal) {
            const workouts = store.data.workouts;
            const checkIns = store.data.checkIns;
            const activeDays = getAllActiveDatesSet().size;

            if (medal.stat === 'workouts') return workouts.length;
            if (medal.stat === 'checkins') return new Set(checkIns.map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'active_days') return activeDays;
            if (medal.stat === 'cardio') return workouts.filter(w => w.type === 'cardio').length;
            if (medal.stat === 'water') return new Set(checkIns.filter(c => c.water).map(c => c.date.slice(0, 10))).size;
            if (medal.stat === 'notes') return checkIns.filter(c => c.notes && c.notes.trim().length > 0).length;
            if (medal.stat === 'restores_used') return Math.max(0, 3 - (store.data.streakRestores ?? 3));
            if (medal.stat === 'micro') return store.data.microWorkouts || 0;
            if (medal.stat === 'battles') return store.data.battlesWon || 0;
            if (medal.stat === 'giant') return store.data.giantKilled ? 1 : 0;

            if (medal.stat === 'weekly_strength') {
                const weekCounts = {};
                workouts.filter(w => w.type === 'strength').forEach(w => {
                    const d = new Date(w.date);
                    const day = d.getDay();
                    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(d.getFullYear(), d.getMonth(), diff);
                    const key = store.getDateStr(monday);
                    weekCounts[key] = (weekCounts[key] || 0) + 1;
                });
                return Math.max(0, ...Object.values(weekCounts));
            }

            if (medal.stat === 'early') {
                const hasEarlyW = workouts.some(w => new Date(w.date).getHours() < 9);
                const hasEarlyC = checkIns.some(c => c.timestamp && new Date(c.timestamp).getHours() < 9);
                return (hasEarlyW || hasEarlyC) ? 1 : 0;
            }

            if (medal.stat === 'night') {
                const hasNightW = workouts.some(w => new Date(w.date).getHours() >= 20);
                const hasNightC = checkIns.some(c => c.timestamp && new Date(c.timestamp).getHours() >= 20);
                return (hasNightW || hasNightC) ? 1 : 0;
            }

            if (medal.stat === 'weekend') {
                const days = new Set([...workouts.map(w => new Date(w.date).getDay()), ...checkIns.filter(c => c.activity).map(c => new Date(c.date).getDay())]);
                return (days.has(6) ? 1 : 0) + (days.has(0) ? 1 : 0);
            }

            if (medal.stat === 'cosmetic') {
                const p = store.data.pet;
                return (p.hat !== 'none' || p.glasses !== 'none' || p.gear !== 'none' || p.aura !== 'none') ? 1 : 0;
            }

            if (medal.stat === 'perfect') {
                const workoutDates = new Set(workouts.map(w => w.date.slice(0, 10)));
                const hasPerfect = checkIns.some(c =>
                    c.activity && c.water && c.sleep && c.energy && workoutDates.has(c.date.slice(0, 10))
                );
                return hasPerfect ? 1 : 0;
            }

            return 0;
        }

                checkAchievements();

                showNotification(`Equipped ${item.name}.`);
            } else {
                if ((store.data.coins || 0) < item.cost) {
                    showInfoModal("Not Enough FitCoins", `You need ${item.cost} FitCoins for ${item.name}. Complete workouts, 2-minute sparks, or win Arena battles to earn more.`);
                    return;
                }
                showConfirmModal("Unlock Style Item", `Spend ${item.cost} FitCoins to unlock ${item.name}?`, () => {
                    store.data.coins -= item.cost;
                    pet.unlocked.push(key);
                    pet[category] = itemId;
                    store.save();
                    checkAchievements();
                    openPetStudio(category);
                    showNotification(`Unlocked & equipped ${item.name}.`);
                }, `Unlock (${item.cost} Coins)`);
            }
        }

        // --- 10. STREAK BATTLE ARENA ---

        function closeBattleArena() {
            const overlay = document.getElementById('battle-modal');

        function startBattle(bossIdx) {
            const boss = ARENA_BOSSES[bossIdx];
            const stats = getFighterStats();
            activeBattle = {
                bossIdx,
                boss,
                playerHp: stats.maxHp,
                playerMaxHp: stats.maxHp,
                bossHp: boss.hp,
                bossMaxHp: boss.hp,
                stats,
                healsLeft: 2,
                log: `${store.data.pet.name} challenges ${boss.name}.`,
                over: false,
                won: false
            };
            renderBattleScreen();
        }

        function executeBattleTurn(action) {
            if (!activeBattle || activeBattle.over) return;
            const b = activeBattle;
            let turnMsg = '';

            if (action === 'strike') {
                const isCrit = Math.random() * 100 < b.stats.crit;
                const baseDmg = Math.max(6, b.stats.atk - Math.floor(b.boss.def * 0.4));
                const dmg = isCrit ? Math.round(baseDmg * 1.65) : baseDmg;
                b.bossHp = Math.max(0, b.bossHp - dmg);
                turnMsg = isCrit ? `CRITICAL STRIKE — You dealt ${dmg} damage.` : `Clean Strike — You dealt ${dmg} damage.`;
            } else if (action === 'power') {
                if (Math.random() < 0.78) {
                    const dmg = Math.max(10, Math.round(b.stats.atk * 1.45) - Math.floor(b.boss.def * 0.3));
                    b.bossHp = Math.max(0, b.bossHp - dmg);
                    turnMsg = `POWER REP — Heavy hit for ${dmg} damage.`;
                } else {
                    turnMsg = `Your Power Rep missed.`;
                }
            } else if (action === 'heal' && b.healsLeft > 0) {
                const healAmt = Math.round(b.playerMaxHp * 0.32);
                b.playerHp = Math.min(b.playerMaxHp, b.playerHp + healAmt);
                b.healsLeft--;
                turnMsg = `Second Wind — Recovered +${healAmt} HP.`;
            }

            if (b.bossHp <= 0) {
                b.over = true;
                b.won = true;
                store.data.battlesWon = (store.data.battlesWon || 0) + 1;
                store.data.coins = (store.data.coins || 0) + b.boss.reward;
                store.data.xp = (store.data.xp || 0) + 50;
                if (b.boss.tierIdx > b.stats.stageIdx) {
                    store.data.giantKilled = true;
                }
                store.save();
                checkAchievements();
                b.log = `${turnMsg} Victory! Earned +${b.boss.reward} FitCoins.`;
                renderBattleScreen(true);
                return;
            }

            const bossDmg = Math.max(4, b.boss.atk - Math.floor(b.stats.def * 0.55) + Math.floor(Math.random() * 5 - 2));
            b.playerHp = Math.max(0, b.playerHp - bossDmg);

            if (b.playerHp <= 0) {
                b.over = true;
                b.won = false;
                b.log = `${turnMsg} ${b.boss.name} hits for ${bossDmg}. You were knocked out—train and try again.`;
            } else {
                b.log = `${turnMsg} ${b.boss.name} strikes back for ${bossDmg} dmg.`;
            }
            renderBattleScreen(true);
        }

        function renderBattleScreen(shake = false) {
            const overlay = document.getElementById('battle-modal');
            const b = activeBattle;
            const pPct = Math.round((b.playerHp / b.playerMaxHp) * 100);
            const bossPct = Math.round((b.bossHp / b.bossMaxHp) * 100);

            overlay.innerHTML = `
                <div class="flex justify-between items-center px-5 py-4 border-b border-zinc-800">

                        </div>

                    <!-- Fighter & Combat Log -->

                    </div>

                    <!-- Player Health & Controls -->
                    <div>
                        <div class="glass-card rounded-[1.75rem] p-4 mb-4">

                                <span class="text-xs font-bold text-brand-main">${store.data.pet.name}</span>
                                <span class="text-xs font-bold text-white">${b.playerHp} / ${b.playerMaxHp} HP</span>

                        ${b.over ? `
                            <button onclick="openBattleArena()" class="w-full py-4 rounded-full bg-brand-main text-brand-contrast font-bold text-sm shadow-lg">

                                    <i data-lucide="zap" class="w-3.5 h-3.5"></i>

                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-400"></i>
                                    <span>Heal (${b.healsLeft})</span>
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
            if (typeof lucide !== 'undefined') lucide.createIcons();

        // --- 11. WORKOUT SESSION & WARM-UP ENGINE ---
        let currentSession = null;
        let restTimerInterval = null;

        function startWorkoutSession(dayNum) {
            const plan = SCHEDULE.find(s => s.day === dayNum);
            if (!plan || !plan.exercises) return;

            const diff = store.data.difficulty || 'steady';
            const stageObj = STAGES.find(s => s.id === diff) || STAGES[2];

            const exercises = plan.exercises.map(exKey => {
                const ex = EXERCISE_DB[exKey];
                const lvl = ex.levels[diff] || ex.levels.steady;
                return {
                    key: exKey,
                    name: ex.name,
                    target: ex.target,
                    desc: ex.desc,
                    alt: ex.alt,
                    sets: lvl.sets,
                    repsLabel: lvl.label,
                    completedSets: 0
                };
            });

            currentSession = {
                dayNum,
                title: plan.title,
                type: plan.type,
                difficulty: diff,
                restSec: stageObj.restSec,
                warmupDone: false,
                exIndex: 0,
                exercises,
                resting: false,
                restRemaining: 0
            };

            const overlay = document.getElementById('workout-session');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            renderWorkoutSession();
        }

        function completeWarmup() {
            if (!currentSession) return;
            currentSession.warmupDone = true;
            renderWorkoutSession();
        }

        function completeSet() {
            if (!currentSession) return;
            const ex = currentSession.exercises[currentSession.exIndex];
            ex.completedSets++;

            if (ex.completedSets >= ex.sets) {
                if (currentSession.exIndex < currentSession.exercises.length - 1) {
                    currentSession.exIndex++;
                    startRestTimer(currentSession.restSec);
                } else {
                    finishWorkout();
                }
            } else {
                startRestTimer(currentSession.restSec);
            }
        }

        function startRestTimer(seconds) {
            currentSession.resting = true;
            currentSession.restRemaining = seconds;
            renderWorkoutSession();

            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                if (!currentSession) {
                    clearInterval(restTimerInterval);
                    return;
                }
                currentSession.restRemaining--;
                if (currentSession.restRemaining <= 0) {
                    skipRest();
                } else {
                    const timerEl = document.getElementById('rest-timer-display');
                    if (timerEl) timerEl.textContent = `${currentSession.restRemaining}s`;
                }
            }, 1000);
        }

        function skipRest() {
            clearInterval(restTimerInterval);
            if (!currentSession) return;
            currentSession.resting = false;
            renderWorkoutSession();
        }

        function adjustRest(delta) {
            if (!currentSession || !currentSession.resting) return;
            currentSession.restRemaining = Math.max(5, currentSession.restRemaining + delta);
            const timerEl = document.getElementById('rest-timer-display');
            if (timerEl) timerEl.textContent = `${currentSession.restRemaining}s`;
        }

        function confirmExitWorkout() {
            showConfirmModal(
                "Exit Workout?",
                "Your current session is not finished yet. Exiting now will not log this workout.",
                () => closeWorkoutSession(),
                "Exit Session"
            );
        }

        function closeWorkoutSession() {
            clearInterval(restTimerInterval);
            currentSession = null;
            const overlay = document.getElementById('workout-session');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function renderWorkoutSession() {
            const overlay = document.getElementById('workout-session');
            if (!currentSession) return;

            if (!currentSession.warmupDone) {
                overlay.innerHTML = `
                    <div class="flex justify-between items-center px-5 py-4 border-b border-zinc-800">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-brand-main">Step 1 • Warm-Up</span>
                            <h3 class="text-lg font-bold text-white">${currentSession.title}</h3>
                        </div>
                        <button onclick="confirmExitWorkout()" class="p-2 rounded-full bg-zinc-900 text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-5 hide-scrollbar">
                        <div class="glass-card rounded-[1.75rem] p-4 mb-4 border border-amber-500/30 bg-amber-950/20 flex items-start gap-2.5">
                            <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
                            <p class="text-xs text-amber-300 font-medium">Safety Note: Move smoothly with control. Stop immediately if you feel sharp pain, dizziness, or unusual shortness of breath.</p>
                        </div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3">3-Minute Mobility Prep</h4>
                        <div class="space-y-3 mb-6">
                            ${WARMUP_STEPS.map((w, i) => `
                                <div class="glass-card rounded-[1.5rem] p-4">

                                        <span class="text-xs font-bold text-brand-main">${w.duration}</span>

                                </div>

                        </div>
                    </div>
                    <div class="p-5 border-t border-zinc-800 bg-zinc-950">
                        <button onclick="completeWarmup()" class="w-full py-4 rounded-full bg-brand-main text-brand-contrast font-bold text-sm shadow-lg shadow-brand-main/20 active:scale-95 transition-transform">
                            Warm-Up Complete • Start Exercises
                        </button>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const ex = currentSession.exercises[currentSession.exIndex];
            const progressPct = Math.round(((currentSession.exIndex) / currentSession.exercises.length) * 100);

            if (currentSession.resting) {
                overlay.innerHTML = `
                    <div class="flex justify-between items-center px-5 py-4 border-b border-zinc-800">
                        <span class="text-xs font-bold text-zinc-400">Exercise ${currentSession.exIndex + 1} of ${currentSession.exercises.length}</span>
                        <button onclick="confirmExitWorkout()" class="p-2 rounded-full bg-zinc-900 text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <span class="text-xs font-bold uppercase tracking-widest text-brand-main mb-2">Recovery Timer</span>
                        <div id="rest-timer-display" class="text-7xl font-extrabold text-white my-4">${currentSession.restRemaining}s</div>
                        <p class="text-sm text-zinc-400 mb-6">Up Next: <b class="text-white">${ex.name}</b> (Set ${ex.completedSets + 1} of ${ex.sets})</p>
                        <div class="flex gap-3 mb-6">
                            <button onclick="adjustRest(-15)" class="px-5 py-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-bold text-zinc-300">-15s</button>
                            <button onclick="adjustRest(15)" class="px-5 py-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-bold text-zinc-300">+15s</button>
                        </div>
                        <button onclick="skipRest()" class="w-full max-w-xs py-4 rounded-full bg-brand-main text-brand-contrast font-bold text-sm shadow-lg active:scale-95 transition-transform">
                            Skip Rest & Continue
                        </button>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            overlay.innerHTML = `
                <div class="px-5 py-4 border-b border-zinc-800">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-brand-main">Exercise ${currentSession.exIndex + 1} of ${currentSession.exercises.length}</span>
                        <button onclick="confirmExitWorkout()" class="p-2 rounded-full bg-zinc-900 text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="w-full h-2 bg-zinc-900 rounded-full overflow-hidden">
                        <div class="h-full bg-brand-main transition-all duration-300" style="width: ${progressPct}%"></div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-5 hide-scrollbar">
                    <span class="inline-block px-3 py-1 rounded-full bg-brand-bg text-brand-main text-[11px] font-bold mb-2">${ex.target}</span>
                    <h2 class="text-2xl font-extrabold text-white mb-4">${ex.name}</h2>

                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div class="glass-card rounded-[1.5rem] p-4 text-center">
                            <p class="text-[11px] text-zinc-400 uppercase font-bold">Current Set</p>
                            <p class="text-2xl font-extrabold text-white mt-1">${ex.completedSets + 1} <span class="text-sm text-zinc-500">/ ${ex.sets}</span></p>
                        </div>
                        <div class="glass-card rounded-[1.5rem] p-4 text-center">
                            <p class="text-[11px] text-zinc-400 uppercase font-bold">Target</p>
                            <p class="text-lg font-extrabold text-brand-main mt-1.5">${ex.repsLabel}</p>
                        </div>
                    </div>

                    <div class="glass-card rounded-[1.75rem] p-5 mb-4">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Proper Technique</h4>
                        <p class="text-sm text-zinc-200 leading-relaxed">${ex.desc}</p>
                    </div>

                    <div class="glass-card rounded-[1.75rem] p-4 border border-zinc-800/80">
                        <p class="text-xs text-zinc-400"><b class="text-zinc-200">Home Modification:</b> ${ex.alt}</p>
                    </div>
                </div>

                <div class="p-5 border-t border-zinc-800 bg-zinc-950">
                    <button onclick="completeSet()" class="w-full py-4 rounded-full bg-brand-main text-brand-contrast font-bold text-sm shadow-lg shadow-brand-main/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        <span>Complete Set ${ex.completedSets + 1} of ${ex.sets}</span>
                    </button>
                </div>
            `;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function finishWorkout() {
            clearInterval(restTimerInterval);
            if (!currentSession) return;

            const todayStr = store.getTodayStr();
            const totalSets = currentSession.exercises.reduce((sum, e) => sum + e.sets, 0);

            const alreadyLoggedToday = store.data.workouts.some(
                w => w.date && w.date.startsWith(todayStr) && w.title === currentSession.title
            );

            if (!alreadyLoggedToday) {
                store.data.workouts.push({
                    date: new Date().toISOString(),
                    title: currentSession.title,
                    type: currentSession.type,
                    difficulty: currentSession.difficulty,
                    exercises: currentSession.exercises.map(e => ({
                        name: e.name,
                        sets: e.sets,
                        reps: e.repsLabel
                    })),
                    kudos: 1
                });

                const ciIdx = store.data.checkIns.findIndex(c => c.date && c.date.startsWith(todayStr));
                if (ciIdx !== -1) {
                    store.data.checkIns[ciIdx].activity = true;
                }

                store.data.coins = (store.data.coins || 0) + 50;
                store.data.xp = (store.data.xp || 0) + 100;
                store.save();
                checkAchievements();
            }

            const summary = {
                title: currentSession.title,
                exercisesCount: currentSession.exercises.length,
                totalSets,
                difficulty: currentSession.difficulty
            };

            closeWorkoutSession();
            showCompletionScreen(summary);
        }

        function showCompletionScreen(summary) {
            const screen = document.getElementById('workout-complete');
            screen.classList.remove('hidden');
            screen.classList.add('flex');

                        <i data-lucide="trophy" class="w-10 h-10 text-brand-main"></i>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-widest text-brand-main mb-1">Session Logged</span>
                    <h2 class="text-3xl font-extrabold text-white mb-2">Workout Complete!</h2>
                    <p class="text-sm text-zinc-400 max-w-xs mb-6">Great consistency, ${store.data.userName || 'King'}. Every completed session builds strength and evolves your Fighter.</p>

                    <div class="glass-card rounded-[2rem] p-5 w-full mb-6 grid grid-cols-3 gap-2 text-center">
                        <div>
                            <p class="text-[11px] text-zinc-400">Exercises</p>
                            <p class="text-lg font-extrabold text-white mt-0.5">${summary.exercisesCount}</p>
                        </div>
                        <div>
                            <p class="text-[11px] text-zinc-400">Total Sets</p>
                            <p class="text-lg font-extrabold text-brand-main mt-0.5">${summary.totalSets}</p>
                        </div>
                        <div>
                            <p class="text-[11px] text-zinc-400">Stage</p>
                            <p class="text-lg font-extrabold text-white mt-0.5">${stageObj.name}</p>
                        </div>

        function generateCoachFeedback(entry) {
            const score = (entry.activity ? 1 : 0) + (entry.water ? 1 : 0) + (entry.sleep ? 1 : 0) + (entry.energy ? 1 : 0);
            const noteLower = (entry.notes || '').toLowerCase();

            let noteInsight = '';
            if (noteLower.includes('tired') || noteLower.includes('sore') || noteLower.includes('exhausted') || noteLower.includes('hard')) {
                noteInsight = "You mentioned feeling fatigued or challenged—prioritize extra water and quality sleep tonight so your muscles rebuild stronger.";
            } else if (noteLower.includes('great') || noteLower.includes('strong') || noteLower.includes('easy') || noteLower.includes('good')) {
                noteInsight = "Your energy and form sound locked in! Keep stacking days like this to unlock the next intensity stage.";
            } else if (entry.notes && entry.notes.trim().length > 0) {
                noteInsight = "Logging your thoughts builds real self-awareness—keep tracking what feels smooth and what needs focus.";
            }

            if (score === 4) {
                return `Elite Discipline — You hit all 4 daily pillars today. ${noteInsight || 'Your recovery and consistency are firing on all cylinders.'}`;
            } else if (score === 3) {
                return `Strong Showing — 3 out of 4 pillars locked in. ${noteInsight || 'Focus on the one unchecked habit tomorrow to make it a clean sweep.'}`;
            } else if (score >= 1) {
                return `Solid Check-In — Showing up and tracking honestly keeps your momentum alive. ${noteInsight || 'Small daily wins compound into major strength gains.'}`;
            }
            return `Honest Check-In Logged — Even on low-energy days, awareness is step one. Try a 2-Minute Spark or gentle stretch tomorrow.`;
        }

        function downloadICS() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dtStart = `${yyyy}${mm}${dd}T070000`;

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Fits//Personal Fitness PWA//EN',
                'BEGIN:VEVENT',
                `UID:fits-daily-7am-${Date.now()}@fits.app`,
                `DTSTAMP:${yyyy}${mm}${dd}T060000Z`,
                `DTSTART:${dtStart}`,
                'DURATION:PT15M',
                'RRULE:FREQ=DAILY',
                'SUMMARY:Fits — Morning Fitness Check-in',
                'DESCRIPTION:Good morning! It is time to show up for yourself. Let us build strength one day at a time.',
                'BEGIN:VALARM',
                'TRIGGER:-PT0M',
                'ACTION:DISPLAY',
                'DESCRIPTION:Fits Daily Workout & Reflection Reminder',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const file = new File([blob], 'fits-7am-reminder.ics', { type: 'text/calendar' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: 'Fits 7:00 AM Reminder' }).catch(() => {});
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'fits-7am-reminder.ics';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            }
            showInfoModal(
                "Add to iPhone Calendar",
                "Open the downloaded 'fits-7am-reminder.ics' file and tap 'Add All' in Apple Calendar to enable your daily 7:00 AM alert."
            );
        }

        async function exportData() {
            const jsonStr = JSON.stringify(store.data, null, 2);
            const fileName = `fits-backup-${store.getTodayStr()}.json`;
            const file = new File([jsonStr], fileName, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Fits Progress Backup'
                    });
                    showNotification("Backup shared/saved.");
                    return;
                } catch (err) {
                    // User cancelled or share unsupported, fall through to clipboard/download
                }
            }

            try {
                await navigator.clipboard.writeText(jsonStr);
                showInfoModal(
                    "Backup Copied to Clipboard",
                    "Your complete JSON progress backup has been copied to your clipboard. Paste it into Apple Notes or a file to keep it safe."
                );
            } catch (e) {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                showNotification("Backup file downloaded.");
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.workouts) || !Array.isArray(parsed.checkIns)) {
                        showInfoModal("Invalid Backup File", "This file does not contain valid Fits progress data. Your existing progress was not touched.");
                        return;
                    }
                    showConfirmModal(
                        "Restore Backup?",
                        `Load backup with ${parsed.workouts.length} workout(s) and ${parsed.checkIns.length} reflection(s)?`,
                        () => {
                            localStorage.setItem('mfj_data', JSON.stringify(parsed));
                            store.load();
                            checkAchievements();
                            router.navigate('home');
                            showNotification("Progress backup restored successfully.");
                        },
                        "Restore Data"
                    );
                } catch (err) {
                    showInfoModal("Import Failed", "Could not read JSON file. Please make sure you selected a valid backup file.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

            dialog.innerHTML = `
                <div class="glass-card bg-zinc-900 border border-zinc-700 rounded-[2rem] p-6 w-full max-w-sm text-center pop-in">
                    <h3 class="text-lg font-extrabold text-white mb-1">${title}</h3>
                    <p class="text-xs text-zinc-400 mb-4">${message}</p>
                    <input type="text" id="dialog-prompt-input" value="${defaultValue || ''}" class="w-full bg-zinc-950 border border-zinc-700 rounded-full py-3 px-5 text-white text-center text-sm font-bold mb-5 focus:border-brand-main outline-none">
                    <div class="flex gap-2.5">
                        <button onclick="closeCustomDialog()" class="flex-1 py-3.5 rounded-full bg-zinc-800 text-zinc-300 font-bold text-xs">Cancel</button>
                        <button id="dialog-prompt-btn" class="flex-1 py-3.5 rounded-full bg-brand-main text-brand-contrast font-bold text-xs">Save</button>
                    </div>
                </div>
            `;
            document.getElementById('dialog-prompt-btn').onclick = () => {
                const val = document.getElementById('dialog-prompt-input').value;
                closeCustomDialog();
                onSubmit(val);
            };
        }

        function closeCustomDialog() {
            const dialog = document.getElementById('custom-dialog');
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-brand-main text-brand-contrast px-6 py-3 rounded-full shadow-xl shadow-brand-main/20 z-[120] fade-in font-bold text-xs flex items-center gap-2 max-w-[90%] w-max text-center';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }
    </script>
</body>
</html>
